    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.5s ease; overflow-x: hidden; }
        button, input { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #editor[contenteditable="true"]:empty:before { content: attr(placeholder); color: #a8a29e; pointer-events: none; display: block; }
        .tabular-nums { font-variant-numeric: tabular-nums; }

        /* DESTAQUE DO TÍTULO (80% do tamanho do timer: 5.6rem) */
        .title-active {
            font-size: 5.6rem !important;
            font-weight: 800 !important;
            color: var(--timer-color, #1c1917) !important;
            opacity: 1 !important;
            line-height: 1.1;
            margin-bottom: 2rem;
            text-align: center;
            transform: scale(1);
            word-break: break-word;
        }
    </style>

<body class="bg-stone-100 min-h-screen flex items-center justify-center text-stone-800 transition-colors duration-500" id="app-body">

    <main id="main-card" class="bg-white p-8 sm:p-10 rounded-[3rem] shadow-2xl border border-stone-100 w-full max-w-md mx-4 flex flex-col items-center z-10 relative">
        
        <header class="w-full flex justify-between items-center mb-8">
            <h1 class="text-lg font-semibold flex items-center gap-2 text-stone-500">
                <i class="ph ph-timer text-2xl"></i> Pomodoro
            </h1>
            
            <div class="flex gap-1.5">
                <div class="relative flex items-center shrink-0" title="Cor de Fundo">
                    <input type="color" id="color-picker" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10" value="#f5f5f4">
                    <button class="text-stone-400 hover:text-stone-600 p-2 rounded-full bg-stone-50"><i class="ph ph-paint-bucket text-lg"></i></button>
                </div>
                <div class="relative flex items-center shrink-0" title="Cor do Cartão">
                    <input type="color" id="card-color-picker" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10" value="#ffffff">
                    <button class="text-stone-400 hover:text-stone-600 p-2 rounded-full bg-stone-50"><i class="ph ph-square text-lg"></i></button>
                </div>
                <div class="relative flex items-center shrink-0" title="Cor do Timer">
                    <input type="color" id="text-color-picker" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10" value="#292524">
                    <button class="text-stone-400 hover:text-stone-600 p-2 rounded-full bg-stone-50"><i class="ph ph-text-t text-lg"></i></button>
                </div>
                <button id="notes-toggle" class="text-stone-400 hover:text-stone-600 p-2 rounded-full bg-stone-50"><i class="ph ph-notepad text-lg"></i></button>
                <button id="settings-toggle" class="text-stone-400 hover:text-stone-600 p-2 rounded-full bg-stone-50"><i class="ph ph-gear text-lg"></i></button>
            </div>
        </header>

        <div class="flex p-1 bg-stone-100 rounded-full mb-10 w-full relative">
            <div id="mode-indicator" class="absolute top-1 bottom-1 left-1 bg-white rounded-full shadow-sm transition-all duration-300" style="width: calc(33.33% - 6px); transform: translateX(0%);"></div>
            <button class="mode-btn relative z-10 flex-1 py-2 text-xs font-bold rounded-full text-stone-800" data-mode="pomodoro">Foco</button>
            <button class="mode-btn relative z-10 flex-1 py-2 text-xs font-bold rounded-full text-stone-600" data-mode="shortBreak">Pausa</button>
            <button class="mode-btn relative z-10 flex-1 py-2 text-xs font-bold rounded-full text-stone-600" data-mode="longBreak">Longa</button>
        </div>

        <div class="flex flex-col items-center justify-center mb-10 w-full">

    <canvas id="pip-canvas" width="300" height="300" class="hidden"></canvas>
    <video id="pip-video" class="hidden" muted autoplay playsinline></video>

    <script>
        // O HUB nao usa service worker (main.tsx remove registros antigos para evitar versoes em cache).
        // Por isso as notificacoes usam a API direta do navegador, com service worker apenas se existir.
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        function showSystemNotification(title, options) {
            if (!('Notification' in window) || Notification.permission !== 'granted') return;
            const direct = () => {
                try {
                    const { vibrate, renotify, ...basic } = options || {};
                    const notification = new Notification(title, basic);
                    notification.onclick = () => { window.focus(); notification.close(); };
                } catch (error) { console.warn('Notificação indisponível', error); }
            };
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
                navigator.serviceWorker.getRegistration()
                    .then((reg) => (reg ? reg.showNotification(title, options) : direct()))
                    .catch(direct);
            } else {
                direct();
            }
        }

        const MODES = { pomodoro: 25, shortBreak: 5, longBreak: 15 };
        let currentMode = 'pomodoro', timeLeft = MODES[currentMode] * 60, isRunning = false;
        let audioReminders = JSON.parse(localStorage.getItem('pomo_complete_reminders_v7')) || [];
        const NOTES_ARCHIVE_KEY = 'pomo_notes_archive_v1';
        let activeArchiveId = null;
        let notesArchive = readNotesArchive();

        const timeDisplay = document.getElementById('time-display'), mainBtn = document.getElementById('main-btn');
        const taskInput = document.getElementById('task-input'), appBody = document.getElementById('app-body');
        const mainCard = document.getElementById('main-card'), inputPomo = document.getElementById('input-pomodoro');
        const inputShort = document.getElementById('input-shortBreak'), inputLong = document.getElementById('input-longBreak');
        const colorPicker = document.getElementById('color-picker'), cardColorPicker = document.getElementById('card-color-picker'), textColorPicker = document.getElementById('text-color-picker');

        // Worker Timer
        let timerWorker = null;
        function initWorker() {
            const blob = new Blob([`let i=null; self.onmessage=e=>{if(e.data==='s'){if(!i)i=setInterval(()=>self.postMessage('t'),1000);}else{clearInterval(i);i=null;}};`], {type:'text/javascript'});
            timerWorker = new Worker(URL.createObjectURL(blob));
            timerWorker.onmessage = () => { 
                if(isRunning){ 
                    timeLeft--; 
                    updateDisplay(); 
                    if(timeLeft <= 0){ 
                        isRunning=false; 
                        timerWorker.postMessage('p'); 
                        setTimeout(() => { triggerTimeUp(); }, 150); 
                    } 
                } 
            };
        }
        initWorker();

        function triggerTimeUp() {
            taskInput.classList.remove('title-active');
            document.getElementById('main-btn-icon').className = "ph-fill ph-play text-xl";
            document.getElementById('main-btn-text').textContent = "INICIAR";
            drawPiP("FIM!");

            const msg = currentMode === 'pomodoro' ? "Sessão concluída!" : "Pausa terminada!";
            showSystemNotification(msg, { 
                        body: taskInput.value || "Seu tempo acabou.", 
                        vibrate: [300, 100, 300], 
                        requireInteraction: true,
                        tag: 'pomo-timer-end'
                    });

            document.getElementById('time-up-title').textContent = msg;
            document.getElementById('time-up-modal').classList.remove('hidden');
        }

        document.getElementById('close-time-up').onclick = () => {
            document.getElementById('time-up-modal').classList.add('hidden');
            resetTimer();
        };

        function saveData() {
            const editor = document.getElementById('editor');
            const data = {
                bgColor: colorPicker.value, cardColor: cardColorPicker.value, textColor: textColorPicker.value,
                modes: MODES, notes: editor ? editor.innerHTML : "",
                task: taskInput.value, attachments: document.getElementById('attachments-list').innerHTML
            };
            localStorage.setItem('pomo_complete_data_v7', JSON.stringify(data));
        }

        function loadData() {
            const saved = localStorage.getItem('pomo_complete_data_v7');
            if(saved) {
                const d = JSON.parse(saved);
                appBody.style.backgroundColor = d.bgColor; colorPicker.value = d.bgColor;
                mainCard.style.backgroundColor = d.cardColor; cardColorPicker.value = d.cardColor;
                timeDisplay.style.color = d.textColor; textColorPicker.value = d.textColor;
                appBody.style.setProperty('--timer-color', d.textColor);
                Object.assign(MODES, d.modes);
                document.getElementById('editor').innerHTML = d.notes || "";
                document.getElementById('attachments-list').innerHTML = d.attachments || "";
                taskInput.value = d.task || "";
                timeLeft = MODES[currentMode] * 60; updateDisplay();
            }
            renderNotesArchive();
        }

        function readNotesArchive() {
            try {
                const parsed = JSON.parse(localStorage.getItem(NOTES_ARCHIVE_KEY) || '[]');
                return Array.isArray(parsed) ? parsed : [];
            } catch {
                return [];
            }
        }

        function persistNotesArchive() {
            localStorage.setItem(NOTES_ARCHIVE_KEY, JSON.stringify(notesArchive));
        }

        function textFromHtml(html) {
            const div = document.createElement('div');
            div.innerHTML = html || '';
            return (div.textContent || '').replace(/\s+/g, ' ').trim();
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function renderNotesArchive() {
            const list = document.getElementById('notes-archive-list');
            if (!list) return;

            if (!notesArchive.length) {
                list.innerHTML = '<div class="text-xs text-stone-500 border border-dashed rounded-xl p-3 bg-white">Nenhuma nota arquivada.</div>';
                return;
            }

            list.innerHTML = notesArchive.map(note => `
                <div class="rounded-xl border p-3 text-xs ${note.id === activeArchiveId ? 'border-amber-300 bg-amber-50' : 'border-stone-200 bg-white'}">
                    <div class="flex justify-between gap-3">
                        <div class="min-w-0">
                            <strong class="block truncate text-stone-700">${escapeHtml(note.title || 'Nota sem título')}</strong>
                            <span class="text-[10px] text-stone-400">${new Date(note.updatedAt || note.createdAt).toLocaleString('pt-BR')}</span>
                        </div>
                        <div class="flex gap-1 shrink-0">
                            <button onclick="openArchivedNote(${note.id})" class="px-2 py-1 rounded-lg border border-stone-200 bg-white font-semibold text-stone-600" type="button">Abrir</button>
                            <button onclick="saveArchivedNote(${note.id})" class="px-2 py-1 rounded-lg border border-stone-200 bg-white font-semibold text-stone-600" type="button">Salvar edição</button>
                            <button onclick="deleteArchivedNote(${note.id})" class="px-2 py-1 rounded-lg border border-red-100 bg-white font-semibold text-red-600" type="button">Excluir</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function archiveCurrentNote() {
            const editor = document.getElementById('editor');
            const html = editor ? editor.innerHTML : '';
            const text = textFromHtml(html);
            if (!text) {
                alert('Escreva uma anotação antes de arquivar.');
                return;
            }

            const now = new Date().toISOString();
            const note = {
                id: Date.now(),
                title: text.slice(0, 58) || 'Nota arquivada',
                html,
                createdAt: now,
                updatedAt: now
            };

            notesArchive.unshift(note);
            activeArchiveId = note.id;
            persistNotesArchive();
            renderNotesArchive();
            document.getElementById('notes-archive-panel').classList.remove('hidden');
            saveData();
        }

        window.openArchivedNote = (id) => {
            const note = notesArchive.find(item => item.id === id);
            const editor = document.getElementById('editor');
            if (!note || !editor) return;
            activeArchiveId = id;
            editor.innerHTML = note.html || '';
            saveData();
            renderNotesArchive();
        };

        window.saveArchivedNote = (id) => {
            const note = notesArchive.find(item => item.id === id);
            const editor = document.getElementById('editor');
            if (!note || !editor) return;
            const html = editor.innerHTML;
            const text = textFromHtml(html);
            note.html = html;
            note.title = text.slice(0, 58) || note.title || 'Nota arquivada';
            note.updatedAt = new Date().toISOString();
            activeArchiveId = id;
            persistNotesArchive();
            renderNotesArchive();
            saveData();
        };

        window.deleteArchivedNote = (id) => {
            if (!confirm('Excluir esta nota arquivada?')) return;
            notesArchive = notesArchive.filter(note => note.id !== id);
            if (activeArchiveId === id) activeArchiveId = null;
            persistNotesArchive();
            renderNotesArchive();
        };

        function updateDisplay() {
            const m = Math.floor(timeLeft/60).toString().padStart(2,'0'), s = (timeLeft%60).toString().padStart(2,'0');
            const str = `${m}:${s}`;
            timeDisplay.textContent = str;
            document.title = str + " - Pomodoro";
            drawPiP(str);
        }

        // --- LEMBRETES DE ÁUDIO ---
        let mediaRec, chunks = [], audioBase64 = null;
        document.getElementById('record-action-btn').onclick = async () => {
            if (!mediaRec || mediaRec.state === 'inactive') {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRec = new MediaRecorder(stream); chunks = [];
                mediaRec.ondataavailable = e => chunks.push(e.data);
                mediaRec.onstop = () => {
                    const blobType = mediaRec.mimeType || 'audio/webm';
                    const reader = new FileReader();
                    reader.readAsDataURL(new Blob(chunks, { type: blobType }));
                    reader.onloadend = () => { audioBase64 = reader.result; document.getElementById('save-reminder').disabled = false; };
                };
                mediaRec.start(); 
                document.getElementById('record-icon-main').className = "ph-fill ph-stop text-3xl";
                document.getElementById('record-status').textContent = "A gravar...";
            } else {
                mediaRec.stop(); 
                document.getElementById('record-icon-main').className = "ph-fill ph-microphone text-3xl";
                document.getElementById('record-status').textContent = "Pronto!";
                mediaRec.stream.getTracks().forEach(t => t.stop());
            }
        };

        function renderReminders() {
            const now = Date.now();
            audioReminders = audioReminders.filter(r => !r.completed || (now - r.time <= 24 * 60 * 60 * 1000));
            const ativos = audioReminders.filter(r => !r.completed);
            const historico = audioReminders.filter(r => r.completed);

            document.getElementById('active-rem-list').innerHTML = ativos.map(r => `
                <div class="flex justify-between items-center bg-stone-50 p-2 rounded-lg border text-[10px]">
                    <span class="font-bold truncate w-24 text-stone-600">${r.title}</span>
                    <span>${new Date(r.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                    <button onclick="deleteRem(${r.id})" class="text-red-500"><i class="ph ph-trash"></i></button>
                </div>
            `).join('');

            document.getElementById('history-rem-list').innerHTML = historico.map(r => `
                <div class="flex justify-between items-center bg-stone-100 p-2 rounded-lg border text-[10px] opacity-75">
                    <span class="font-bold truncate w-20 text-stone-500">${r.title}</span>
                    <span>${new Date(r.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                    <div class="flex gap-2">
                        <button onclick="playHistRem(${r.id})" class="text-purple-600"><i class="ph-fill ph-play-circle text-lg"></i></button>
                        <button onclick="deleteRem(${r.id})" class="text-red-500"><i class="ph ph-trash text-lg"></i></button>
                    </div>
                </div>
            `).join('');
        }

        window.deleteRem = id => { audioReminders = audioReminders.filter(r => r.id !== id); localStorage.setItem('pomo_complete_reminders_v7', JSON.stringify(audioReminders)); renderReminders(); };
        window.playHistRem = id => {
            const rem = audioReminders.find(r => r.id === id);
            if(rem && rem.audio) { const a = new Audio(rem.audio); a.play(); }
        };

        document.getElementById('save-reminder').onclick = () => {
            const title = document.getElementById('reminder-title').value || "Lembrete";
            const dt = document.getElementById('reminder-datetime').value;
            const triggerTime = dt ? new Date(dt).getTime() : Date.now() + (parseInt(document.getElementById('reminder-minutes').value) * 60000);
            audioReminders.push({ id: Date.now(), title, audio: audioBase64, time: triggerTime, completed: false });
            localStorage.setItem('pomo_complete_reminders_v7', JSON.stringify(audioReminders));
            audioBase64 = null; document.getElementById('create-reminder-modal').classList.add('hidden');
            renderReminders();
        };

        // AJUSTADO: Lógica de Notificação do Lembrete de Áudio igual à do Timer
        setInterval(() => {
            const now = Date.now();
            const toTriggerIndex = audioReminders.findIndex(rem => !rem.completed && now >= rem.time);

            if (toTriggerIndex !== -1) {
                const rem = audioReminders[toTriggerIndex];
                rem.completed = true;
                localStorage.setItem('pomo_complete_reminders_v7', JSON.stringify(audioReminders));
                renderReminders();

                // Notificação Forçada via Service Worker com Vibração (Igual ao Timer)
                showSystemNotification("🎤 " + rem.title, { 
                            body: "Novo lembrete de áudio disponível. Toque para ouvir.", 
                            vibrate: [300, 100, 300], 
                            requireInteraction: true,
                            tag: 'pomo-audio-reminder',
                            renotify: true
                        });

                const audioEl = document.getElementById('trigger-reminder-audio');
                document.getElementById('trigger-reminder-title').textContent = rem.title;
                audioEl.src = rem.audio;
                audioEl.load();
                document.getElementById('trigger-reminder-modal').classList.remove('hidden');
            }
        }, 2000);

        document.getElementById('close-trigger-reminder').onclick = () => {
            document.getElementById('trigger-reminder-modal').classList.add('hidden');
            const audioEl = document.getElementById('trigger-reminder-audio');
            audioEl.pause(); audioEl.src = ""; 
        };

        // --- UI CORE ---
        mainBtn.onclick = () => {
            if (isRunning) { 
                isRunning = false; timerWorker.postMessage('p'); 
                taskInput.classList.remove('title-active');
            } else { 
                isRunning = true; timerWorker.postMessage('s'); 
                if(taskInput.value.trim() !== "") taskInput.classList.add('title-active');
            }
            document.getElementById('main-btn-icon').className = isRunning ? "ph-fill ph-pause text-xl" : "ph-fill ph-play text-xl";
            document.getElementById('main-btn-text').textContent = isRunning ? "PAUSAR" : "INICIAR";
            saveData();
        };

        function resetTimer() { isRunning = false; timerWorker.postMessage('p'); timeLeft = MODES[currentMode] * 60; updateDisplay(); taskInput.classList.remove('title-active'); saveData(); }
        document.getElementById('reset-btn').onclick = resetTimer;

        document.querySelectorAll('.mode-btn').forEach((btn, i) => btn.onclick = () => {
            currentMode = btn.dataset.mode;
            document.getElementById('mode-indicator').style.transform = `translateX(${i * 100}%)`;
            resetTimer();
        });

        document.getElementById('settings-toggle').onclick = () => {
            inputPomo.value = MODES.pomodoro; inputShort.value = MODES.shortBreak; inputLong.value = MODES.longBreak;
            document.getElementById('settings-modal').classList.remove('hidden');
        };

        document.getElementById('save-settings').onclick = () => {
            MODES.pomodoro = parseInt(inputPomo.value); MODES.shortBreak = parseInt(inputShort.value); MODES.longBreak = parseInt(inputLong.value);
            saveData(); document.getElementById('settings-modal').classList.add('hidden'); resetTimer();
        };

        colorPicker.oninput = (e) => { appBody.style.backgroundColor = e.target.value; saveData(); };
        cardColorPicker.oninput = (e) => { mainCard.style.backgroundColor = e.target.value; saveData(); };
        textColorPicker.oninput = (e) => {
            timeDisplay.style.color = e.target.value;
            appBody.style.setProperty('--timer-color', e.target.value);
            saveData();
        };

        function formatDoc(cmd, val = null) { document.execCommand(cmd, false, val); saveData(); }
        document.getElementById('editor').oninput = saveData;
        document.getElementById('task-input').oninput = saveData;

        function saveNotesNow() {
            saveData();
            const button = document.getElementById('save-notes');
            if (!button) return;
            const original = button.textContent || 'Salvar';
            button.textContent = 'Salvo';
            window.setTimeout(() => { button.textContent = original; }, 1200);
        }

        function floatNotesToHub() {
            saveData();
            const editor = document.getElementById('editor');
            window.parent?.postMessage(
                { type: 'hub:pomodoro-notes-float', notes: editor ? editor.innerHTML : '' },
                window.location.origin
            );
            document.getElementById('notes-sidebar').classList.add('translate-x-full');
        }

        document.getElementById('notes-toggle').onclick = () => {
            loadData();
            document.getElementById('notes-sidebar').classList.remove('translate-x-full');
        };
        document.getElementById('save-notes').onclick = saveNotesNow;
        document.getElementById('archive-note').onclick = archiveCurrentNote;
        document.getElementById('open-notes-archive').onclick = () => {
            renderNotesArchive();
            document.getElementById('notes-archive-panel').classList.toggle('hidden');
        };
        document.getElementById('close-notes-archive').onclick = () => document.getElementById('notes-archive-panel').classList.add('hidden');
        document.getElementById('float-notes').onclick = floatNotesToHub;
        document.getElementById('close-notes').onclick = () => {
            saveData();
            document.getElementById('notes-sidebar').classList.add('translate-x-full');
        };
        document.getElementById('cancel-settings').onclick = () => document.getElementById('settings-modal').classList.add('hidden');
        document.getElementById('open-reminder-btn').onclick = () => { document.getElementById('create-reminder-modal').classList.remove('hidden'); renderReminders(); };
        document.getElementById('cancel-reminder').onclick = () => document.getElementById('create-reminder-modal').classList.add('hidden');
        document.getElementById('attach-btn').onclick = () => document.getElementById('file-input').click();
        
        document.getElementById('file-input').onchange = function() {
            const list = document.getElementById('attachments-list');
            Array.from(this.files).forEach(f => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-2 bg-white border rounded-lg text-[10px]";
                div.innerHTML = `<span class="truncate w-32 font-bold">${f.name}</span><button onclick="this.parentElement.remove(); saveData();" class="text-red-500"><i class="ph ph-trash"></i></button>`;
                list.appendChild(div);
            });
            saveData();
        };

        const canvas = document.getElementById('pip-canvas'), ctx = canvas.getContext('2d'), video = document.getElementById('pip-video');
        function drawPiP(text) {
            ctx.fillStyle = mainCard.style.backgroundColor || "#ffffff"; ctx.fillRect(0,0,300,300);
            ctx.fillStyle = timeDisplay.style.color || "#292524"; ctx.font = "bold 80px Inter"; ctx.textAlign = "center";
            ctx.fillText(text, 150, 165);
        }
        document.getElementById('pip-toggle').onclick = async () => {
            try { video.srcObject = canvas.captureStream(); await video.play(); await video.requestPictureInPicture(); } catch(e) {}
        };

        loadData(); updateDisplay(); renderReminders();
    </script>
<script src="/apps/hub-app-shell.js" defer></script>
</body>
</html>
