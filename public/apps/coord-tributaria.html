            </div>
            <div class="dashboard-focus-meta">
              <span class="agenda-filter-summary__chip">Pautas abertas: ${stats.openAgenda}</span>
              <span class="agenda-filter-summary__chip">Atrasadas: ${stats.overdue}</span>
              <span class="agenda-filter-summary__chip">Com anexos: ${stats.agendasWithAttachments}</span>
            </div>
            ${
              stats.agendaEntries.length
                ? `
                  <div class="dashboard-agenda-list">
                    ${stats.agendaEntries.map((item) => this.renderDashboardAgendaItem(item)).join("")}
                  </div>
                `
                : this.renderEmpty("As pautas do periodo aparecem aqui assim que forem registradas.")
            }
          </article>
        </div>
      </section>
    `;
  }

  renderDashboardObservationCard(entry) {
    const collapsed = this.isCardCollapsed("dashboard-observations", entry.id);
    return `
      <article class="dashboard-observation-card ${collapsed ? "is-collapsed" : ""}">
        <div class="dashboard-observation-card__head">
          <div class="dashboard-observation-card__identity">
            <span
              class="dashboard-observation-indicator"
              data-state="${entry.hasObservation ? "filled" : "empty"}"
              title="${escapeHtml(entry.hasObservation ? "Com observacoes registradas" : "Sem observacoes registradas")}"
              aria-label="${escapeHtml(entry.hasObservation ? "Com observacoes registradas" : "Sem observacoes registradas")}"
            ></span>
            <div>
              <strong>${escapeHtml(entry.name)}</strong>
              <p>${escapeHtml(entry.role)}</p>
            </div>
          </div>
          <div class="dashboard-observation-card__actions">
            <span class="badge-inline">${entry.hasObservation ? "Com observacoes" : "Sem observacoes"}</span>
            ${this.renderArrowToggleButton({
              collapsed,
              label: collapsed ? "Expandir observacoes" : "Minimizar observacoes",
              attributes: {
                action: "toggle-dashboard-observation-card",
                id: entry.id,
              },
            })}
          </div>
        </div>
        ${
          collapsed
            ? ""
            : `
              <div class="dashboard-observation-card__preview ${entry.hasObservation ? "" : "is-empty"}">
                ${entry.hasObservation ? renderMultiline(entry.observation) : escapeHtml(entry.observationPreview)}
              </div>
              ${
                entry.orientations.length
                  ? `
                    <div class="dashboard-observation-card__orientations">
                      <div class="dashboard-observation-card__orientations-title">Orientacoes do colaborador</div>
                      <div class="dashboard-observation-card__orientation-list">
                        ${entry.orientations
                          .map(
                            (item) => `
                              <div class="dashboard-observation-card__orientation-item">
                                <strong>${escapeHtml(item.title)}</strong>
                                <span>${escapeHtml(item.dueDate ? `Prazo ${formatDate(item.dueDate)}` : "Sem prazo")}</span>
                              </div>
                            `
                          )
                          .join("")}
                      </div>
                    </div>
                  `
                  : ""
              }
              <div class="dashboard-observation-card__footer">
                <span>
                  ${
                    entry.orientationCount
                      ? `${entry.orientationCount} orientacao(oes) registrada(s)`
                      : "Sem orientacoes registradas"
                  }
                </span>
                ${this.renderCompactActionButton({
                  label: "Abrir em avaliacoes",
                  attributes: {
                    action: "open-dashboard-note",
                    id: entry.id,
                  },
                })}
              </div>
            `
        }
      </article>
    `;
  }

            <h3>${escapeHtml(item.title)}</h3>
          </div>
          <div class="dashboard-work-item__pills">
            <span class="status-pill" data-tone="${escapeHtml(STATUS_META[item.status]?.tone || "progress")}">
              ${escapeHtml(STATUS_META[item.status]?.label || item.status)}
            </span>
            <span class="priority-pill" data-tone="${escapeHtml(PRIORITY_META[item.priority]?.tone || "medium")}">

  renderOrientationEditor(collaborator, collaboratorNote) {
    const canDuplicate = this.getCollaborators(false).some((item) => item.id !== collaborator.id);
    if (!collaboratorNote.guidanceItems.length) {
      return `
        <div class="orientation-empty">
          <p>Sem orientacoes registradas para este colaborador.</p>
        </div>
      `;
    }
    return `
      <div class="orientation-list">
        ${collaboratorNote.guidanceItems
          .map((orientation, index) => {
            const priority = PRIORITY_META[orientation.priority] || PRIORITY_META.medium;
            const status = ORIENTATION_STATUS_META[orientation.status] || ORIENTATION_STATUS_META.not_started;
            const collapseKey = `${collaborator.id}:${orientation.id}`;
            const collapsed = this.isCardCollapsed("orientation-items", collapseKey);
            const title = orientation.text.trim().split("\n")[0] || `Orientacao ${index + 1}`;
            return `
              <article class="orientation-card ${collapsed ? "is-collapsed" : ""}">
                <input
                  type="hidden"
                  value="${escapeHtml(orientation.id)}"
                  data-orientation-collaborator="${escapeHtml(collaborator.id)}"
                  data-orientation-index="${index}"
                  data-orientation-field="id"
                >
                <div class="orientation-card__toolbar">
                  <div class="orientation-card__title-row">
                    <strong class="orientation-card__title">${escapeHtml(title)}</strong>
                    ${this.renderArrowToggleButton({
                      collapsed,
                      label: collapsed ? "Expandir orientacao" : "Minimizar orientacao",
                      attributes: {
                        action: "toggle-orientation-card",
                        id: collaborator.id,
                        "orientation-id": orientation.id,
                      },
                    })}
                  </div>
                  <div class="orientation-card__meta-row">
                    <div class="orientation-card__badges">
                      <span
                        class="orientation-priority-indicator priority-dot priority-dot--${escapeHtml(priority.tone)}"
                        title="Prioridade ${escapeHtml(priority.label)}"
                        aria-label="Prioridade ${escapeHtml(priority.label)}"
                      ></span>
                      <span class="status-pill" data-tone="${escapeHtml(status.tone)}">${escapeHtml(status.label)}</span>
                    </div>
                    ${
                      collapsed
                        ? ""
                        : `
                          <div class="orientation-card__actions">
                            ${this.renderIconActionButton({
                              icon: "save",
                              label: "Salvar orientacao",
                              className: "orientation-icon-button",
                              attributes: {
                                action: "save-orientation-item",
                                id: collaborator.id,
                                "orientation-id": orientation.id,
                              },
                            })}
                            ${this.renderIconActionButton({
                              icon: "edit",
                              label: "Editar orientacao",
                              className: "orientation-icon-button",
                              attributes: {
                                action: "edit-orientation-item",
                                id: collaborator.id,
                                "orientation-id": orientation.id,
                              },
                            })}
                            ${
                              canDuplicate
                                ? this.renderIconActionButton({
                                    icon: "copy",
                                    label: "Duplicar orientacao",
                                    className: "orientation-icon-button",
                                    attributes: {
                                      action: "open-orientation-copy-modal",
                                      id: collaborator.id,
                                      "orientation-id": orientation.id,
                                    },
                                  })
                                : ""
                            }
                            ${this.renderIconActionButton({
                              icon: "trash",
                              label: "Remover orientacao",
                              className: "orientation-icon-button orientation-icon-button--danger",
                              attributes: {
                                action: "remove-guidance-item",
                                id: collaborator.id,
                                "orientation-id": orientation.id,
                              },
                            })}
                          </div>
                        `
                    }
                  </div>
                </div>
                ${
                  collapsed
                    ? ""
                    : `
                      <div class="orientation-card__body">
                        <label class="field">
                          <span>Orientacao</span>
                          <textarea
                            class="textarea-short"
                            placeholder="Escreva a orientacao para o colaborador."
                            data-orientation-collaborator="${escapeHtml(collaborator.id)}"
                            data-orientation-index="${index}"
                            data-orientation-field="text"

                        </label>
                        <div class="orientation-editor__grid">
                          <label class="field">
                            <span>Prioridade</span>
                            <select
                              data-orientation-collaborator="${escapeHtml(collaborator.id)}"
                              data-orientation-index="${index}"
                              data-orientation-field="priority"
                            >
                              ${Object.entries(PRIORITY_META)
                                .map(
                                  ([value, meta]) => `
                                    <option value="${escapeHtml(value)}" ${orientation.priority === value ? "selected" : ""}>${escapeHtml(meta.label)}</option>
                                  `
                                )
                                .join("")}
                            </select>
                          </label>
                          <label class="field">
                            <span>Prazo</span>
                            <input
                              type="date"
                              value="${escapeHtml(orientation.dueDate || "")}"
                              data-orientation-collaborator="${escapeHtml(collaborator.id)}"
                              data-orientation-index="${index}"
                              data-orientation-field="dueDate"

                          </label>
                          <label class="field">
                            <span>Status</span>
                            <select

                    `
                }
              </article>
            `;
          })
          .join("")}
      </div>
    `;
  }

      <section class="view ${this.ui.activeView === "reports" ? "is-active" : ""}">
        <div class="split-grid">
          <article class="panel span-4">
            <div class="panel-header">
              <div>
                <h2>Filtros e exportacoes</h2>
                <p>Monte relatorios mensais ou semanais por colaborador, pauta ou visao consolidada.</p>

            </div>
            <div class="report-grid">
              <label class="field">
                <span>Periodo base</span>
                <input type="month" data-filter-group="report" name="periodId" value="${escapeHtml(this.ui.reportFilters.periodId)}">
              </label>
              <div class="two-columns">
                <label class="field">
                  <span>Escopo</span>
                  <select data-filter-group="report" name="scope">
                    <option value="month" ${this.ui.reportFilters.scope === "month" ? "selected" : ""}>Mensal</option>
                    <option value="week" ${this.ui.reportFilters.scope === "week" ? "selected" : ""}>Semanal</option>
                  </select>
                </label>
                <label class="field">
                  <span>Referencia da semana</span>
                  <input type="date" data-filter-group="report" name="weekDate" value="${escapeHtml(this.ui.reportFilters.weekDate)}">
                </label>
              </div>
              <label class="field">
                <span>Contexto</span>
                <select data-filter-group="report" name="context">
                  <option value="all" ${this.ui.reportFilters.context === "all" ? "selected" : ""}>Tudo</option>
                  <option value="task" ${this.ui.reportFilters.context === "task" ? "selected" : ""}>Somente tarefas</option>
                  <option value="agenda" ${this.ui.reportFilters.context === "agenda" ? "selected" : ""}>Somente pautas</option>
                </select>
              </label>
              <label class="field">
                <span>Colaborador</span>
                <select data-filter-group="report" name="collaboratorId">
                  <option value="all" ${this.ui.reportFilters.collaboratorId === "all" ? "selected" : ""}>Todos</option>
                  ${this.getCollaborators()
                    .map(
                      (collaborator) => `
                        <option value="${escapeHtml(collaborator.id)}" ${this.ui.reportFilters.collaboratorId === collaborator.id ? "selected" : ""}>
                          ${escapeHtml(collaborator.name)}
                        </option>
                      `
                    )
                    .join("")}
                </select>
              </label>
              <div class="report-actions">
                <button type="button" data-action="export-report-csv">Exportar tabela CSV</button>
                <button type="button" class="ghost-button" data-action="export-report-pdf">Abrir em PDF</button>
              </div>
            </div>
          </article>

          <article class="panel span-8">
            <div class="panel-header">
              <div>
                <h2>Preview do relatorio</h2>
                <p>${escapeHtml(payload.rangeLabel)} | ${payload.summary.total} registro(s) selecionado(s).</p>
              </div>
            </div>

            <div class="report-summary">
              <div class="metric-cards">
                <article class="metric-card">
                  <span class="eyebrow">Total</span>
                  <strong>${payload.summary.total}</strong>
                  <p>linhas no filtro atual</p>
                </article>
                <article class="metric-card">
                  <span class="eyebrow">Abertos</span>
                  <strong>${payload.summary.open}</strong>
                  <p>itens em acompanhamento</p>
                </article>
                <article class="metric-card">
                  <span class="eyebrow">Concluidos</span>
                  <strong>${payload.summary.done}</strong>
                  <p>registros finalizados</p>
                </article>
                <article class="metric-card">
                  <span class="eyebrow">Atrasados</span>
                  <strong>${payload.summary.overdue}</strong>
                  <p>pendencias vencidas</p>
                </article>
              </div>
            </div>

            ${
              this.ui.reportFilters.scope === "month"
                ? `
                  <div class="summary-grid">
                    <div class="meta-block">
                      <span>Notas gerais do periodo</span>
                      <strong>${escapeHtml(notes.generalNotes ? "Preenchidas" : "Sem resumo")}</strong>
                    </div>
                    <div class="meta-block">
                      <span>Colaboradores com registro</span>
                      <strong>${payload.collaboratorNotes.length}</strong>
                    </div>
                    <div class="meta-block">
                      <span>Orientacoes abertas</span>
                      <strong>${
                        payload.collaboratorNotes.reduce(
                          (total, entry) =>
                            total +
                            normalizeOrientationList(entry.note.guidanceItems).filter(
                              (item) => item.text && item.status !== "done" && item.status !== "blocked"
                            ).length,
                          0
                        )
                      }</strong>
                    </div>
                  </div>
                  ${
                    notes.generalNotes
                      ? `
                        <div class="list-card__notes">
                          ${renderMultiline(notes.generalNotes)}
                        </div>
                      `
                      : ""
                  }
                `
                : ""
            }

            ${
              payload.collaboratorNotes.length && this.ui.reportFilters.scope === "month"
                ? `
                  <div class="list-grid">
                    ${payload.collaboratorNotes
                      .map(
                        (entry) => `
                          <article class="list-card">
                            <div class="list-card__header">
                              <div>
                                <h3>${escapeHtml(entry.collaborator.name)}</h3>
                                <p>Nota: ${escapeHtml(entry.note.score || "-")}</p>
                              </div>
                              <span class="badge-inline">${escapeHtml(entry.note.themes || "Sem temas")}</span>
                            </div>
                            ${
                              entry.note.note
                                ? `<div class="list-card__notes">${renderMultiline(entry.note.note)}</div>`
                                : `<div class="orientation-empty"><p>Sem observacoes registradas.</p></div>`
                            }
                            <div class="orientation-report-block">
                              <div class="helper-row">Orientacoes do periodo</div>
                              ${renderOrientationSummaryHtml(entry.note.guidanceItems, "Sem orientacoes registradas.")}
                            </div>
                          </article>
                        `
                      )
                      .join("")}
                  </div>
                `
                : ""
            }

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Tipo</th>
                    <th>Titulo</th>
                    <th>Colaborador</th>
                    <th>Responsavel</th>
                    <th>Prioridade</th>
                    <th>Status</th>
                    <th>Data ref.</th>
                    <th>Prazo</th>
                    <th>Temas</th>
                    <th>Observacoes</th>
                    <th>Anexos</th>
                    <th>Origem</th>
                  </tr>
                </thead>
                <tbody>
                  ${
                    payload.items.length
                      ? payload.items
                          .map(
                            (item) => `
                              <tr>
                                <td>${escapeHtml(item.kind === "task" ? "Tarefa" : "Pauta")}</td>
                                <td>${escapeHtml(item.title)}</td>
                                <td>${escapeHtml(this.getCollaboratorName(item.collaboratorId))}</td>
                                <td>${escapeHtml(this.getCollaboratorName(item.responsibleId))}</td>
                                <td>${escapeHtml(PRIORITY_META[item.priority]?.label || item.priority)}</td>
                                <td>${escapeHtml(STATUS_META[item.status]?.label || item.status)}</td>
                                <td>${escapeHtml(formatDate(item.referenceDate))}</td>
                                <td>${escapeHtml(formatDate(item.dueDate))}</td>
                                <td>${escapeHtml(item.themes.join(", ") || "-")}</td>
                                <td>${renderMultiline(item.observations || item.description || "-") || "-"}</td>
                                <td>${escapeHtml(item.attachmentRefs.map((attachment) => attachment.name).join(", ") || "-")}</td>
                                <td>${escapeHtml(item.carriedFromPeriodId ? `Trazido de ${formatPeriodLabel(item.carriedFromPeriodId)}` : "-")}</td>
                              </tr>
                            `
                          )
                          .join("")
                      : `<tr><td colspan="12">Nenhum dado encontrado para os filtros selecionados.</td></tr>`
                  }
                </tbody>
              </table>
            </div>
          </article>
        </div>
      </section>
    `;
  }

  renderAttachmentEditor(item) {
    if (!item?.attachmentRefs?.length) {
      return "";
    }
    return `
      <div class="field-group">
        <span>Anexos atuais</span>
        <div class="attachment-list">
          ${item.attachmentRefs
            .map(
              (attachment) => `
                <label class="attachment-chip">
                  <input type="checkbox" name="removeAttachmentIds" value="${escapeHtml(attachment.id)}">
                  Remover ${escapeHtml(attachment.name)}
                </label>
              `
            )
            .join("")}
        </div>
      </div>
    `;
  }

  renderCompactItem(item) {
    const owner = this.getItemOwnerName(item);
    const dueLabel = item.dueDate ? formatDate(item.dueDate) : "Sem prazo";
    const referenceLabel = item.referenceDate ? formatDate(item.referenceDate) : "-";
    const kindLabel = item.kind === "task" ? "Tarefa individual" : "Pauta semanal";
    const attachmentCount = item.attachmentRefs?.length || 0;
    return `
      <button type="button" class="dashboard-work-item" data-action="open-dashboard-item" data-id="${escapeHtml(item.id)}">
        <div class="dashboard-work-item__header">
          <div>
            <div class="dashboard-work-item__eyebrow">${escapeHtml(kindLabel)}</div>
            <h3>${escapeHtml(item.title)}</h3>
            <p>${escapeHtml(owner)}</p>
          </div>
          <div class="dashboard-work-item__pills">
            <span class="status-pill" data-tone="${escapeHtml(STATUS_META[item.status]?.tone || "progress")}">
              ${escapeHtml(STATUS_META[item.status]?.label || item.status)}
            </span>
            <span class="priority-pill" data-tone="${escapeHtml(PRIORITY_META[item.priority]?.tone || "medium")}">
              ${escapeHtml(PRIORITY_META[item.priority]?.label || item.priority)}
            </span>
          </div>
        </div>
        <div class="dashboard-work-item__meta">
          <span><strong>Prazo:</strong> ${escapeHtml(dueLabel)}</span>
          <span><strong>Referencia:</strong> ${escapeHtml(referenceLabel)}</span>
          <span><strong>Anexos:</strong> ${attachmentCount}</span>
        </div>
      </button>
    `;
  }

  renderFullItemCard(item) {
    const group = item.kind === "task" ? "tasks" : "agenda";
    return this.renderCollapsibleCard({
      group,
      collapseId: item.id,
      cardClass: "list-card",
      summary: `
        <div class="list-card__header collapsible-card__header">
          <div>
            <h3>${escapeHtml(item.title)}</h3>
            <p>
              ${escapeHtml(item.kind === "task" ? this.getCollaboratorName(item.collaboratorId) : this.getCollaboratorName(item.responsibleId))}
              | Prazo ${escapeHtml(formatDate(item.dueDate))}
            </p>
          </div>
          <div class="collapsible-card__summary-side">
            <span class="status-pill" data-tone="${escapeHtml(STATUS_META[item.status]?.tone || "progress")}">
              ${escapeHtml(STATUS_META[item.status]?.label || item.status)}
            </span>
            <span class="priority-pill" data-tone="${escapeHtml(PRIORITY_META[item.priority]?.tone || "medium")}">
              ${escapeHtml(PRIORITY_META[item.priority]?.label || item.priority)}
            </span>
          </div>
        </div>
      `,
      body: `
        <div class="helper-row">
          <span>${escapeHtml(item.kind === "task" ? "Tarefa individual" : "Pauta semanal")} | atualizado em ${escapeHtml(formatDateTime(item.updatedAt))}</span>
        </div>

        <div class="list-card__meta">
          <div class="meta-block">
            <span>Colaborador</span>
            <strong>${escapeHtml(this.getCollaboratorName(item.collaboratorId))}</strong>
          </div>
          <div class="meta-block">
            <span>Responsavel</span>
            <strong>${escapeHtml(this.getCollaboratorName(item.responsibleId))}</strong>
          </div>
          <div class="meta-block">
            <span>Data de referencia</span>
            <strong>${escapeHtml(formatDate(item.referenceDate))}</strong>
          </div>
          <div class="meta-block">
            <span>Prazo</span>
            <strong>${escapeHtml(formatDate(item.dueDate))}</strong>
          </div>
        </div>

        ${
          item.themes.length
            ? `<div class="tag-list">${item.themes.map((theme) => `<span class="tag">${escapeHtml(theme)}</span>`).join("")}</div>`
            : ""
        }

        ${
          item.description || item.observations
            ? `<div class="list-card__notes">${renderMultiline(
                [item.description, item.observations].filter(Boolean).join("\n\n")
              )}</div>`
            : ""
        }

        ${
          item.carriedFromPeriodId || item.copiedFromId
            ? `
              <div class="helper-row">
                ${
                  item.carriedFromPeriodId
                    ? `<span class="badge-inline">Trazido de ${escapeHtml(formatPeriodLabel(item.carriedFromPeriodId))}</span>`
                    : ""
                }
                ${item.copiedFromId ? `<span class="badge-inline">Criado por copia</span>` : ""}
              </div>
            `
            : ""
        }

        ${
          item.attachmentRefs.length
            ? `
              <div class="attachment-list">
                ${item.attachmentRefs
                  .map(
                    (attachment) => `
                      <button type="button" class="attachment-chip" data-action="open-attachment" data-id="${escapeHtml(attachment.id)}">
                        ${escapeHtml(attachment.name)}
                      </button>
                    `
                  )
                  .join("")}
              </div>
            `
            : ""
        }

        <div class="list-card__actions">
          <button type="button" class="ghost-button" data-action="edit-item" data-kind="${escapeHtml(item.kind)}" data-id="${escapeHtml(item.id)}">Editar</button>
          <button type="button" class="ghost-button" data-action="copy-item" data-id="${escapeHtml(item.id)}">Levar / copiar</button>
          <button type="button" class="quiet-button" data-action="toggle-item-complete" data-id="${escapeHtml(item.id)}">
            ${item.status === "done" ? "Reabrir" : "Concluir"}
          </button>
          <button type="button" class="danger-button" data-action="delete-item" data-id="${escapeHtml(item.id)}">Excluir</button>
        </div>
      `,
    });
  }

  renderCopyModal() {
    const source = this.getItemById(this.ui.copyModal.itemId);
    const collaborators = this.getCollaborators(false).filter((collaborator) => collaborator.id !== source?.collaboratorId);
    return `
      <div class="modal-backdrop ${this.ui.copyModal.open ? "is-open" : ""}">
        <div class="modal-card">
          <div class="panel-header">
            <div>
              <h2>Levar ou copiar registro</h2>
              <p>
                ${
                  source
                    ? `Duplique "${escapeHtml(source.title)}" para outros colaboradores ou para a pauta da reuniao.`
                    : "Selecione um item para copiar."
                }
              </p>
            </div>
          </div>
          ${
            source
              ? `
                <form id="copy-form" class="stack-form">
                  <input type="hidden" name="itemId" value="${escapeHtml(source.id)}">
                  <div class="two-columns">
                    <label class="field">
                      <span>Periodo de destino</span>
                      <input type="month" name="targetPeriod" value="${escapeHtml(this.ui.copyModal.targetPeriod || this.state.settings.activePeriod)}">
                    </label>
                    <label class="field">
                      <span>Status do novo item</span>
                      <select name="statusOverride">
                        <option value="pending">Reiniciar como aberto</option>
                        <option value="keep">Manter status atual</option>
                      </select>
                    </label>
                  </div>

                  ${
                    source.kind === "task"
                      ? `
                        <label class="field checkbox-chip">
                          <input type="checkbox" name="copyToAgenda">
                          Levar tambem para a pauta da reuniao
                        </label>
                      `
                      : ""
                  }

                  <div class="field-group">
                    <span>Copiar para colaboradores</span>
                    ${
                      collaborators.length
                        ? `
                          <div class="checkbox-grid">
                            ${collaborators
                              .map(
                                (collaborator) => `
                                  <label class="checkbox-chip">
                                    <input type="checkbox" name="targetCollaboratorIds" value="${escapeHtml(collaborator.id)}">
                                    ${escapeHtml(collaborator.name)}
                                  </label>
                                `
                              )
                              .join("")}
                          </div>
                        `
                        : `<div class="empty-state"><p>Cadastre colaboradores ativos para liberar esta funcao.</p></div>`
                    }
                  </div>

                  <div class="modal-card__footer">
                    <button type="button" class="quiet-button" data-action="close-copy-modal">Cancelar</button>
                    <button type="submit">Gerar copia</button>
                  </div>
                </form>
              `
              : `
                <div class="empty-state">
                  <p>Abra o menu "Levar / copiar" em uma tarefa ou pauta para usar este comando.</p>
                </div>
                <div class="modal-card__footer">
                  <button type="button" class="quiet-button" data-action="close-copy-modal">Fechar</button>
                </div>
              `
          }
        </div>
      </div>
    `;
  }

  renderOrientationCopyModal() {
    const { collaboratorId, orientationId } = this.ui.orientationCopyModal;
    const collaborator = this.getCollaboratorById(collaboratorId);
    const sourceNote = collaborator ? this.getCollaboratorPeriodNote(collaborator.id) : null;
    const sourceOrientation = sourceNote?.guidanceItems.find((item) => item.id === orientationId) || null;
    const targets = this.getCollaborators(false).filter((item) => item.id !== collaboratorId);
    return `
      <div class="modal-backdrop ${this.ui.orientationCopyModal.open ? "is-open" : ""}">
        <div class="modal-card">
          <div class="panel-header">
            <div>
              <h2>Duplicar orientacao</h2>
              <p>
                ${
                  sourceOrientation && collaborator
                    ? `Leve a orientacao de ${escapeHtml(collaborator.name)} para outro colaborador ativo ou para todos os ativos.`
                    : "Selecione uma orientacao preenchida para duplicar."
                }
              </p>
            </div>
          </div>
          ${
            sourceOrientation && collaborator
              ? `
                <form id="orientation-copy-form" class="stack-form">
                  <input type="hidden" name="sourceCollaboratorId" value="${escapeHtml(collaborator.id)}">
                  <input type="hidden" name="orientationId" value="${escapeHtml(sourceOrientation.id)}">

                  <div class="orientation-card orientation-card--summary">
                    <div class="orientation-card__header">
                      <strong>${escapeHtml(sourceOrientation.text)}</strong>
                      <div class="list-card__actions">
                        <span class="priority-pill" data-tone="${escapeHtml(PRIORITY_META[sourceOrientation.priority]?.tone || "medium")}">
                          ${escapeHtml(PRIORITY_META[sourceOrientation.priority]?.label || sourceOrientation.priority)}
                        </span>
                        <span class="status-pill" data-tone="${escapeHtml(ORIENTATION_STATUS_META[sourceOrientation.status]?.tone || "pending")}">
                          ${escapeHtml(ORIENTATION_STATUS_META[sourceOrientation.status]?.label || sourceOrientation.status)}
                        </span>
                      </div>
                    </div>
                    <div class="orientation-card__meta">
                      <span>Prazo: ${escapeHtml(sourceOrientation.dueDate ? formatDate(sourceOrientation.dueDate) : "Sem prazo")}</span>
                    </div>
                  </div>

                  ${
                    targets.length
                      ? `
                        <label class="field checkbox-chip">
                          <input type="checkbox" name="targetAll">
                          Duplicar para todos os colaboradores ativos
                        </label>
                        <div class="checkbox-grid">
                          ${targets
                            .map(
                              (target) => `
                                <label class="checkbox-chip">
                                  <input type="checkbox" name="target-${escapeHtml(target.id)}">
                                  ${escapeHtml(target.name)}
                                </label>
                              `
                            )
                            .join("")}
                        </div>
                      `
                      : `<div class="orientation-empty"><p>Nao ha outros colaboradores ativos disponiveis para duplicacao.</p></div>`
                  }

                  <div class="modal-card__footer">
                    <button type="button" class="quiet-button" data-action="close-orientation-copy-modal">Cancelar</button>
                    <button type="submit" ${targets.length ? "" : "disabled"}>Duplicar orientacao</button>
                  </div>
                </form>
              `
              : `
                <div class="empty-state">
                  <p>Abra uma orientacao na aba de avaliacoes e use o botao "Duplicar".</p>
                </div>
                <div class="modal-card__footer">
                  <button type="button" class="quiet-button" data-action="close-orientation-copy-modal">Fechar</button>
                </div>
              `
          }
        </div>
      </div>
    `;
  }

  renderEmpty(message) {
    return `
      <div class="empty-state">
        <p>${escapeHtml(message)}</p>
      </div>
    `;
  }

  renderPeriodSummaryEmailModal() {

      <div class="modal-backdrop ${this.ui.periodSummaryEmailModal.open ? "is-open" : ""}">
        <div class="modal-card">
          <div class="panel-header">
            <div>
              <span class="panel-header__eyebrow">Email consolidado</span>
              <h2>Enviar resumo do periodo</h2>
              <p>Escolha o e-mail de destino e o tipo de conteudo que deseja encaminhar.</p>
            </div>
          </div>
          <form id="period-summary-email-form" class="stack-form modal-form-grid">

                <strong>${escapeHtml(formatPeriodLabel(this.state.settings.activePeriod))}</strong>
              </div>
              <div class="modal-highlight">
                <span>Colaboradores ativos</span>
                <strong>${escapeHtml(String(collaborators.length))}</strong>

            <div class="modal-section-card">

                    <input type="radio" name="summaryMode" value="general_only">

              <li>Use "Somente colaboradores" para receber as observacoes individuais e as orientacoes abertas de quem tiver informacoes preenchidas.</li>
              <li>Use o modo completo quando quiser um registro unico com seu panorama geral e o detalhamento individual da equipe.</li>

            <div class="modal-card__footer">
              <button type="button" class="quiet-button" data-action="close-period-summary-email-modal">Cancelar</button>
              <button type="submit">Enviar resumo</button>
            </div>
          </form>
        </div>
      </div>
    `;

  renderAgendaEmailModal() {
    const agendaSummary = this.getAgendaFilterSummary();
    return `
      <div class="modal-backdrop ${this.ui.agendaEmailModal.open ? "is-open" : ""}">
        <div class="modal-card">
          <div class="panel-header">
            <div>
              <span class="panel-header__eyebrow">Email de pautas</span>
              <h2>Enviar pautas por e-mail</h2>
              <p>Encaminhe as pautas da tela respeitando os filtros atuais de busca, status, prioridade, responsavel e visibilidade.</p>
            </div>
          </div>
          <form id="agenda-email-form" class="stack-form modal-form-grid">
            <div class="modal-highlight-grid">
              ${agendaSummary.metrics
                .map(
                  (metric) => `
                    <div class="modal-highlight">
                      <span>${escapeHtml(metric.label)}</span>
                      <strong>${escapeHtml(metric.value)}</strong>
                    </div>
                  `
                )
                .join("")}
            </div>

            <div class="modal-section-card">
              <div class="modal-section-card__title">Destino</div>
              <label class="field">
                <span>E-mail de destino</span>
                <input
                  name="recipientEmail"
                  type="email"
                  required
                  value="${escapeHtml(this.state.settings.agendaEmailRecipient || "")}"
                  placeholder="Ex.: seuemail@empresa.com"
                >
              </label>
            </div>

            <div class="modal-section-card">
              <div class="modal-section-card__title">Escopo</div>
              <div class="two-columns">
                <label class="field">
                  <span>Escopo</span>
                  <select name="agendaScope">
                    <option value="month" selected>Periodo atual</option>
                    <option value="week">Semana especifica</option>
                  </select>
                </label>
                <label class="field">
                  <span>Referencia da semana</span>
                  <input name="weekDate" type="date" value="${escapeHtml(todayIsoDate())}">
                </label>
              </div>
            </div>

            <div class="modal-section-card">
              <div class="modal-section-card__title">Filtros atuais</div>
              <div class="agenda-filter-summary agenda-filter-summary--modal">
                ${agendaSummary.parts.map((part) => `<span class="agenda-filter-summary__chip">${escapeHtml(part)}</span>`).join("")}
              </div>
            </div>

            <div class="modal-inline-note">
              O e-mail inclui titulo, responsavel, prioridade, status, datas, temas, descricao e observacoes de cada pauta filtrada.
            </div>

            <ul class="modal-helper-list">
              <li>O envio mensal usa exatamente os filtros aplicados nesta tela.</li>
              <li>Ao escolher uma semana especifica, o sistema recorta a pauta pela data de referencia da reuniao.</li>
              <li>Se nenhuma pauta se encaixar no filtro, o app interrompe o envio e avisa antes.</li>
            </ul>

            <div class="modal-card__footer">
              <button type="button" class="quiet-button" data-action="close-agenda-email-modal">Cancelar</button>
              <button type="submit">Enviar pautas</button>
            </div>
          </form>
        </div>
      </div>
    `;
  }
}

window.addEventListener("DOMContentLoaded", () => {
  const root = document.getElementById("app");
  if (!root) {
    return;
  }
  const app = new TributaryCoordinatorApp(root);
  if (globalThis.__APP_TEST_HOOKS__ && typeof globalThis.__APP_TEST_HOOKS__ === "object") {
    globalThis.__APP_TEST_HOOKS__.app = app;
  }
  void app.init().catch((error) => {
    console.error(error);
    root.innerHTML = `
      <div class="loading-screen">
        <span class="loading-screen__eyebrow">Falha de inicializacao</span>
        <h1>O artefato nao conseguiu carregar.</h1>
        <p>${escapeHtml(error?.message || "Verifique se o navegador local permite IndexedDB.")}</p>
      </div>
    `;
  });
});

  </script>
</body>
</html>
