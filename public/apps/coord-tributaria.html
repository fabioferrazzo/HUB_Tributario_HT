<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordenacao Tributaria | Reunioes, Avaliacoes e Pautas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23174c44'/%3E%3Cpath d='M17 18h30v5H17zm0 11h30v5H17zm0 11h18v5H17z' fill='%23fffaf0'/%3E%3C/svg%3E">
  <style>
:root {
  --bg: #f3efe4;
  --bg-accent: #d9ead7;
  --surface: rgba(255, 251, 243, 0.92);
  --surface-strong: #fffdf7;
  --surface-muted: #f1e7d5;
  --line: rgba(53, 61, 53, 0.12);
  --line-strong: rgba(53, 61, 53, 0.26);
  --ink: #1f2b22;
  --muted: #5c6b61;
  --accent: #174c44;
  --accent-strong: #0e3731;
  --accent-soft: rgba(23, 76, 68, 0.12);
  --warning: #9a6c1d;
  --warning-soft: rgba(154, 108, 29, 0.12);
  --danger: #9d3d2e;
  --danger-soft: rgba(157, 61, 46, 0.12);
  --success: #2f6f45;
  --success-soft: rgba(47, 111, 69, 0.12);
  --shadow: 0 18px 44px rgba(35, 49, 40, 0.12);
  --radius-xl: 24px;
  --radius-lg: 18px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --sidebar-width: 320px;
  --transition: 180ms ease;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  color: var(--ink);
  font-family: "Bahnschrift", "Segoe UI Variable Text", "Trebuchet MS", sans-serif;
  background:
    radial-gradient(circle at top left, rgba(217, 234, 215, 0.95), transparent 35%),
    radial-gradient(circle at right 15%, rgba(227, 204, 157, 0.5), transparent 28%),
    linear-gradient(135deg, #f5f2e8 0%, #ebe2cf 46%, #f0ead9 100%);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(23, 76, 68, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(23, 76, 68, 0.03) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.65), transparent 92%);
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
}

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(280px, var(--sidebar-width)) 1fr;
  gap: 18px;
  padding: 18px;
}

.app-shell--sidebar-collapsed {
  grid-template-columns: 84px 1fr;
}

.loading-screen {
  width: min(620px, 100%);
  margin: auto;
  padding: 42px;
  border-radius: var(--radius-xl);
  background: rgba(255, 252, 246, 0.92);
  box-shadow: var(--shadow);
  text-align: left;
}

.loading-screen__eyebrow,
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-size: 0.82rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.sidebar {
  position: sticky;
  top: 18px;
  align-self: start;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: calc(100vh - 36px);
  padding: 22px;
  border: 1px solid rgba(255, 255, 255, 0.42);
  border-radius: 28px;
  background:
    linear-gradient(180deg, rgba(12, 43, 38, 0.94), rgba(21, 61, 54, 0.9)),
    rgba(15, 51, 45, 0.94);
  color: #eef4ee;
  box-shadow: var(--shadow);
}

.sidebar.is-collapsed {
  align-items: center;
  min-height: calc(100vh - 36px);
  padding: 18px 10px;
}

.brand-block h1,
.panel h2,
.section-header h2,
.toolbar h1,
.modal-card h2 {
  margin: 0;
  font-family: "Georgia", "Cambria", serif;
  font-weight: 700;
  letter-spacing: 0.01em;
}

.brand-block p,
.toolbar p,
.period-panel p,
.muted-text,
.empty-state p,
.metric-card p,
.list-card p,
.chart-card p {
  margin: 0;
  color: inherit;
}

.brand-block p,
.period-panel p,
.quick-actions__hint {
  color: rgba(238, 244, 238, 0.74);
}

.sidebar-section {
  display: grid;
  gap: 12px;
}

.sidebar-toggle-row {
  display: flex;
  justify-content: flex-end;
}

.sidebar-toggle-row--collapsed {
  width: 100%;
  justify-content: center;
}

.sidebar .sidebar-toggle-row .arrow-toggle-button {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.18);
  color: #eef4ee;
}

.sidebar .sidebar-toggle-row .arrow-toggle-button:hover {
  background: rgba(255, 255, 255, 0.18);
}

.period-form,
.stack-form,
.filter-grid,
.note-grid,
.report-grid {
  display: grid;
  gap: 12px;
}

.stack-form {
  gap: 14px;
}

.sidebar label,
.field,
.field-group {
  display: grid;
  gap: 6px;
}

.sidebar label span,
.field > span,
.field-group > span,
.fieldset-title {
  font-size: 0.85rem;
  color: var(--muted);
  font-weight: 600;
}

.sidebar input,
.sidebar select,
.sidebar textarea,
.content input,
.content select,
.content textarea {
  width: 100%;
  padding: 11px 13px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.95);
  color: var(--ink);
  transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
}

.sidebar input,
.sidebar select {
  background: rgba(255, 255, 255, 0.16);
  border-color: rgba(255, 255, 255, 0.18);
  color: #f6f9f6;
}

.sidebar input:focus,
.sidebar select:focus,
.sidebar textarea:focus,
.content input:focus,
.content select:focus,
.content textarea:focus {
  outline: none;
  border-color: rgba(23, 76, 68, 0.72);
  box-shadow: 0 0 0 4px rgba(23, 76, 68, 0.12);
}

.sidebar input::placeholder,
.sidebar textarea::placeholder {
  color: rgba(255, 255, 255, 0.55);
}

.textarea-compact {
  min-height: 110px;
  resize: vertical;
}

.textarea-short {
  min-height: 88px;
  resize: vertical;
}

.textarea-tall {
  min-height: 150px;
  resize: vertical;
}

.button-row,
.toolbar-actions,
.actions-row,
.list-card__actions,
.report-actions,
.quick-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.toolbar-actions--grid {
  display: grid;
  grid-template-columns: repeat(2, max-content);
  gap: 10px;
  justify-content: end;
}

.toolbar-actions__secondary {
  grid-column: 2;
}

.button,
.ghost-button,
.quiet-button,
.button-inline,
.sidebar button,
.content button,
.button-like {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 11px 16px;
  border: 1px solid transparent;
  border-radius: 12px;
  text-decoration: none;
  transition: transform var(--transition), box-shadow var(--transition), background var(--transition), color var(--transition), border-color var(--transition);
}

.button,
.sidebar button,
.content button.primary {
  background: var(--accent);
  color: #f7fcf7;
  box-shadow: 0 12px 22px rgba(15, 55, 49, 0.22);
}

.button:hover,
.sidebar button:hover,
.content button.primary:hover {
  transform: translateY(-1px);
  background: var(--accent-strong);
}

.ghost-button,
.button-like {
  background: rgba(23, 76, 68, 0.08);
  color: var(--accent);
  border-color: rgba(23, 76, 68, 0.18);
}

.ghost-button:hover,
.button-like:hover {
  transform: translateY(-1px);
  background: rgba(23, 76, 68, 0.13);
}

.sidebar .ghost-button,
.sidebar .button-like {
  background: rgba(255, 255, 255, 0.08);
  color: #eef4ee;
  border-color: rgba(255, 255, 255, 0.14);
}

.quiet-button {
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
}

.quiet-button:hover {
  transform: translateY(-1px);
  border-color: var(--line-strong);
}

.danger-button {
  background: var(--danger-soft);
  color: var(--danger);
  border-color: rgba(157, 61, 46, 0.18);
}

.success-button {
  background: var(--success-soft);
  color: var(--success);
  border-color: rgba(47, 111, 69, 0.18);
}

.button-like input {
  display: none;
}

.content {
  display: grid;
  gap: 16px;
  align-content: start;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
  padding: 24px 26px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 28px;
  background: linear-gradient(180deg, rgba(255, 252, 246, 0.95), rgba(249, 245, 236, 0.92));
  box-shadow: var(--shadow);
}

.toolbar p {
  color: var(--muted);
  max-width: 78ch;
}

.views {
  display: grid;
  gap: 16px;
}

.view {
  display: none;
}

.view.is-active {
  display: grid;
  gap: 16px;
}

.panel,
.metric-card,
.chart-card,
.list-card,
.note-card,
.report-card,
.modal-card {
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: var(--radius-xl);
  background: linear-gradient(180deg, rgba(255, 252, 246, 0.96), rgba(252, 249, 242, 0.92));
  box-shadow: var(--shadow);
}

.panel,
.chart-card,
.report-card,
.modal-card {
  padding: 22px;
}

.panel-grid,
.dashboard-grid,
.chart-grid,
.notes-grid,
.split-grid {
  display: grid;
  gap: 16px;
}

.agenda-column,
.agenda-filter-panel {
  display: grid;
  gap: 16px;
  align-content: start;
}

.dashboard-grid {
  grid-template-columns: repeat(12, minmax(0, 1fr));
}

.chart-grid,
.notes-grid,
.split-grid {
  grid-template-columns: repeat(12, minmax(0, 1fr));
}

.metric-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px;
}

.dashboard-metric-cards {
  grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
}

.metric-card {
  padding: 18px;
  position: relative;
  overflow: hidden;
}

.metric-card::after {
  content: "";
  position: absolute;
  right: -28px;
  bottom: -30px;
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: rgba(23, 76, 68, 0.08);
}

.metric-card strong {
  display: block;
  margin-top: 8px;
  font-size: clamp(1.5rem, 3vw, 2rem);
}

.metric-card p {
  color: var(--muted);
}

.dashboard-focus-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}

.dashboard-worklist,
.dashboard-collaborator-list,
.dashboard-observation-list,
.dashboard-agenda-list,
.dashboard-orientation-list,
.dashboard-orientation-groups {
  display: grid;
  gap: 12px;
}

.dashboard-work-item {
  display: grid;
  gap: 12px;
  width: 100%;
  min-height: 0;
  padding: 16px;
  text-align: left;
  border-radius: 18px;
  border: 1px solid rgba(23, 76, 68, 0.12);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(247, 244, 237, 0.88));
  box-shadow: none;
}

.dashboard-work-item:hover {
  transform: translateY(-1px);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(244, 248, 245, 0.92));
}

.dashboard-work-item__header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: start;
}

.dashboard-work-item__eyebrow {
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.dashboard-work-item h3 {
  margin: 0 0 4px;
  font-size: 1rem;
  line-height: 1.3;
}

.dashboard-work-item p {
  color: var(--muted);
}

.dashboard-work-item__pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

.dashboard-work-item__meta {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px;
  color: var(--muted);
  font-size: 0.88rem;
}

.dashboard-work-item__meta strong {
  color: var(--ink);
}

.dashboard-collaborator-card {
  display: grid;
  gap: 10px;
  padding: 16px;
  border-radius: 18px;
  border: 1px solid rgba(23, 76, 68, 0.12);
  background: rgba(255, 255, 255, 0.78);
}

.dashboard-collaborator-card__head {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
}

.dashboard-collaborator-card__head strong {
  font-size: 1rem;
}

.dashboard-collaborator-card__meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.dashboard-collaborator-card__meta span {
  display: inline-flex;
  align-items: center;
  min-height: 30px;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(23, 76, 68, 0.06);
  color: var(--accent);
  font-size: 0.82rem;
  font-weight: 600;
}

.dashboard-observation-card {
  display: grid;
  gap: 12px;
  padding: 16px;
  border-radius: 18px;
  border: 1px solid rgba(23, 76, 68, 0.12);
  background: rgba(255, 255, 255, 0.82);
}

.dashboard-observation-card.is-collapsed {
  gap: 0;
  padding: 12px 14px;
}

.dashboard-observation-card__head,
.dashboard-observation-card__footer,
.dashboard-observation-card__identity,
.dashboard-orientation-group__header,
.dashboard-observation-card__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
}

.dashboard-observation-card__identity {
  justify-content: flex-start;
}

.dashboard-observation-card__actions {
  justify-content: flex-end;
}

.dashboard-observation-card__identity strong {
  display: block;
  font-size: 0.98rem;
}

.dashboard-observation-card__identity p {
  color: var(--muted);
  font-size: 0.85rem;
}

.dashboard-observation-indicator {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex: none;
  box-shadow: 0 0 0 4px rgba(23, 76, 68, 0.08);
}

.dashboard-observation-indicator[data-state="filled"] {
  background: #3d8b59;
}

.dashboard-observation-indicator[data-state="empty"] {
  background: #b9c6bf;
}

.dashboard-observation-card__preview {
  max-height: 156px;
  overflow: auto;
  padding: 14px 16px;
  border-radius: 16px;
  background: rgba(23, 76, 68, 0.04);
  color: var(--ink);
  font-size: 0.92rem;
  line-height: 1.6;
}

.dashboard-observation-card__preview.is-empty {
  color: var(--muted);
}

.dashboard-observation-card__footer {
  color: var(--muted);
  font-size: 0.84rem;
}

.dashboard-observation-card__footer .compact-action-button {
  margin-left: auto;
}

.dashboard-observation-card__orientations {
  display: grid;
  gap: 10px;
  padding: 14px 16px;
  border-radius: 16px;
  background: rgba(23, 76, 68, 0.05);
}

.dashboard-observation-card__orientations-title {
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.dashboard-observation-card__orientation-list {
  display: grid;
  gap: 8px;
}

.dashboard-observation-card__orientation-item {
  display: grid;
  gap: 4px;
  padding: 10px 12px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.88);
  border: 1px solid rgba(23, 76, 68, 0.1);
}

.dashboard-observation-card__orientation-item strong {
  font-size: 0.9rem;
  line-height: 1.35;
}

.dashboard-observation-card__orientation-item span {
  color: var(--muted);
  font-size: 0.84rem;
}

.dashboard-agenda-item {
  gap: 14px;
}

.dashboard-agenda-item__body {
  display: grid;
  gap: 8px;
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.55;
}

.dashboard-agenda-item__body p {
  margin: 0;
}

.dashboard-agenda-item__body strong {
  color: var(--ink);
}

.dashboard-orientation-group {
  display: grid;
  gap: 10px;
}

.dashboard-orientation-item {
  display: grid;
  gap: 10px;
  width: 100%;
  min-height: 0;
  padding: 14px 16px;
  text-align: left;
  border-radius: 16px;
  border: 1px solid rgba(23, 76, 68, 0.12);
  background: rgba(255, 255, 255, 0.78);
  box-shadow: none;
}

.dashboard-orientation-item.is-collapsed {
  gap: 0;
  padding: 12px 14px;
}

.dashboard-orientation-item:hover {
  transform: translateY(-1px);
  background: rgba(247, 250, 248, 0.96);
}

.dashboard-orientation-item__head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: start;
}

.dashboard-orientation-item__title {
  display: block;
  font-size: 0.98rem;
  line-height: 1.35;
}

.dashboard-orientation-item__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: flex-end;
}

.dashboard-orientation-item__meta {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px;
  color: var(--muted);
  font-size: 0.86rem;
}

.dashboard-orientation-item__meta strong {
  color: var(--ink);
}

.span-3 {
  grid-column: span 3;
}

.span-4 {
  grid-column: span 4;
}

.span-5 {
  grid-column: span 5;
}

.span-6 {
  grid-column: span 6;
}

.span-7 {
  grid-column: span 7;
}

.span-8 {
  grid-column: span 8;
}

.span-12 {
  grid-column: span 12;
}

.section-header,
.panel-header,
.list-card__header,
.chart-card__header {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  align-items: flex-start;
  margin-bottom: 16px;
}

.panel-header__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: flex-end;
}

.agenda-column__header {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.section-header p,
.panel-header p,
.chart-card__header p {
  color: var(--muted);
}

.nav-grid {
  display: grid;
  gap: 8px;
}

.nav-button {
  justify-content: flex-start;
  width: 100%;
  background: transparent;
  color: rgba(238, 244, 238, 0.78);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.nav-button.is-active {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.16);
  color: #ffffff;
}

.period-chip-list,
.tag-list,
.attachment-list,
.checkbox-grid,
.shortcuts-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.period-chip,
.tag,
.attachment-chip,
.checkbox-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.86);
  color: var(--ink);
}

.sidebar .period-chip {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.14);
  color: #edf4ed;
}

.period-chip.is-current {
  background: rgba(255, 255, 255, 0.16);
  border-color: rgba(255, 255, 255, 0.22);
}

.legend-dot,
.status-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  flex: none;
}

.status-pill,
.priority-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 28px;
  padding: 4px 9px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-size: 0.8rem;
  font-weight: 600;
}

.status-pill[data-tone="pending"] {
  background: var(--warning-soft);
  color: var(--warning);
  border-color: rgba(154, 108, 29, 0.16);
}

.priority-pill[data-tone="high"] {
  background: var(--danger-soft);
  color: var(--danger);
  border-color: rgba(157, 61, 46, 0.16);
}

.status-pill[data-tone="progress"] {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: rgba(23, 76, 68, 0.16);
}

.priority-pill[data-tone="medium"] {
  background: var(--warning-soft);
  color: var(--warning);
  border-color: rgba(154, 108, 29, 0.16);
}

.collapsible-card__summary > .section-header h2,

.orientation-icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;

  border-radius: 9px;
  border: 1px solid rgba(23, 76, 68, 0.14);
  background: rgba(255, 255, 255, 0.84);
  color: var(--accent);
  box-shadow: none;
  transition: transform var(--transition), background var(--transition), border-color var(--transition), color var(--transition);
}

.orientation-icon-button:hover {
  transform: translateY(-1px);
  background: rgba(23, 76, 68, 0.08);
}

.orientation-icon-button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

.orientation-icon-button--danger {

}

.arrow-toggle-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  padding: 0;
  flex: none;
  border: 1px solid rgba(23, 76, 68, 0.18);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.78);
  color: var(--accent);
}

.arrow-toggle-button:hover {
  transform: translateY(-1px);
  background: rgba(23, 76, 68, 0.08);
}

.orientation-icon-button .ui-icon,
.icon-button .ui-icon,
.arrow-toggle-button .ui-icon {
  pointer-events: none;
}

.orientation-icon-button--copy {
  color: #2bbcd2;
  border-color: rgba(43, 188, 210, 0.24);
  background: rgba(43, 188, 210, 0.08);
}

.orientation-icon-button--copy:hover {
  background: rgba(43, 188, 210, 0.14);
}

.ui-icon {
  position: relative;
  display: inline-block;
  width: 16px;
  height: 16px;
  flex: none;
  color: currentColor;
  box-sizing: border-box;
}

.ui-icon::before,
.ui-icon::after {
  content: "";
  position: absolute;
  box-sizing: border-box;
}

.ui-icon--add::before,
.ui-icon--add::after {
  left: 2px;
  top: 7px;
  width: 12px;
  height: 2px;
  border-radius: 999px;
  background: currentColor;
}

.ui-icon--add::after {
  left: 7px;
  top: 2px;
  width: 2px;
  height: 12px;
}

.ui-icon--save {
  border: 2px solid currentColor;
  border-radius: 2px;
  background:
    linear-gradient(currentColor, currentColor) center 72% / 7px 2px no-repeat,
    linear-gradient(currentColor, currentColor) center 24% / 6px 4px no-repeat;
}

.ui-icon--edit::before {
  left: 2px;
  top: 8px;
  width: 12px;
  height: 2px;
  border-radius: 999px;
  background: currentColor;
  transform: rotate(-45deg);
  transform-origin: center;
}

.ui-icon--edit::after {
  right: 1px;
  top: 2px;
  width: 5px;
  height: 5px;
  background: currentColor;
  transform: rotate(-45deg);
  clip-path: polygon(0 100%, 100% 0, 100% 100%);
}

.ui-icon--copy {
  width: 11px;
  height: 13px;
  margin-left: 3px;
  margin-top: 2px;
  border: 2px solid currentColor;
  border-radius: 2px;
}

.ui-icon--copy::before {
  left: -5px;
  top: -5px;
  width: 11px;
  height: 13px;
  border: 2px solid currentColor;
  border-radius: 2px;
  background: transparent;
}

.ui-icon--mail {
  border: 2px solid currentColor;
  border-radius: 3px;
}

.ui-icon--mail::before,
.ui-icon--mail::after {
  top: 5px;
  width: 8px;
  height: 2px;
  border-radius: 999px;
  background: currentColor;
}

.ui-icon--mail::before {
  left: 0;
  transform: rotate(34deg);
  transform-origin: left center;
}

.ui-icon--mail::after {
  right: 0;
  transform: rotate(-34deg);
  transform-origin: right center;
}

.ui-icon--trash::before,
.ui-icon--trash::after {
  left: 1px;
  top: 7px;
  width: 14px;
  height: 2px;
  border-radius: 999px;
  background: currentColor;
}

.ui-icon--trash::before {
  transform: rotate(45deg);
}

.ui-icon--trash::after {
  transform: rotate(-45deg);
}

.ui-icon--collapse::before,
.ui-icon--collapse::after,
.ui-icon--expand::before,
.ui-icon--expand::after {
  top: 7px;
  width: 9px;
  height: 2px;
  border-radius: 999px;
  background: currentColor;
}

.ui-icon--collapse::before,
.ui-icon--expand::before {
  left: 0;
}

.ui-icon--collapse::after,
.ui-icon--expand::after {
  right: 0;
}

.ui-icon--collapse::before {
  transform: rotate(-45deg);
}

.ui-icon--collapse::after {
  transform: rotate(45deg);
}

.ui-icon--expand::before {
  transform: rotate(45deg);
}

.ui-icon--expand::after {
  transform: rotate(-45deg);
}

<body>
  <div id="app" class="app-shell">
    <div class="loading-screen">
      <span class="loading-screen__eyebrow">Coordenacao Tributaria</span>
      <h1>Preparando seu artefato local</h1>
      <p>Carregando colaboradores, pautas, tarefas, anexos e historico.</p>
    </div>
  </div>
  <script>
const APP_DB_NAME = "coordenacao-tributaria-local";
const APP_DB_VERSION = 1;
const STATE_STORE = "appState";
const ATTACHMENT_STORE = "attachments";
const STATE_KEY = "main";
const DEFAULT_ATTACHMENT_ACCEPT = ".doc,.docx,.pdf,.xlsx,.xls,.txt,.png,.jpg,.jpeg";

const STATUS_META = {
  pending: { label: "Aberto", tone: "pending" },
  progress: { label: "Em andamento", tone: "progress" },
  waiting: { label: "Aguardando", tone: "waiting" },
  done: { label: "Concluido", tone: "done" },
  cancelled: { label: "Cancelado", tone: "cancelled" },
};

const PRIORITY_META = {
  high: { label: "Alta", tone: "high" },
  medium: { label: "Media", tone: "medium" },
  low: { label: "Baixa", tone: "low" },
};

const ORIENTATION_STATUS_META = {
  not_started: { label: "Nao iniciado", tone: "pending" },
  in_progress: { label: "Em andamento", tone: "progress" },
  done: { label: "Concluido", tone: "done" },
  blocked: { label: "Inviabilizado", tone: "cancelled" },
};

const EMAIL_OPEN_ORIENTATION_STATUSES = new Set(["not_started", "in_progress"]);

const VIEW_META = [
  { id: "dashboard", label: "Dashboard" },
  { id: "collaborators", label: "Colaboradores" },
  { id: "notes", label: "Avaliacoes" },
  { id: "agenda", label: "Pautas" },
];

const OPEN_STATUSES = new Set(["pending", "progress", "waiting"]);

function nowIso() {
  return new Date().toISOString();
}

function todayIsoDate() {
  return new Date().toISOString().slice(0, 10);
}

function getCurrentPeriodId() {
  return todayIsoDate().slice(0, 7);
}

function safeNumber(value) {
  const parsed = Number(value);
  return Number.isFinite(parsed) ? parsed : 0;
}

function generateId(prefix) {
  if (globalThis.crypto?.randomUUID) {
    return `${prefix}-${globalThis.crypto.randomUUID()}`;
  }
  return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
}

function escapeHtml(value = "") {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function renderMultiline(value = "") {
  const trimmed = value.trim();
  if (!trimmed) {
    return "";
  }
  return escapeHtml(trimmed).replace(/\n/g, "<br>");
}

function formatDate(value) {
  if (!value) {
    return "-";
  }
  const date = new Date(`${value}T12:00:00`);
  if (Number.isNaN(date.getTime())) {
    return value;
  }
  return new Intl.DateTimeFormat("pt-BR", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
  }).format(date);
}

function formatDateTime(value) {
  if (!value) {
    return "-";
  }
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) {
    return value;
  }
  return new Intl.DateTimeFormat("pt-BR", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  }).format(date);
}

function formatPeriodLabel(periodId) {
  if (!periodId || !/^\d{4}-\d{2}$/.test(periodId)) {
    return periodId || "-";
  }
  const date = new Date(`${periodId}-01T12:00:00`);
  return new Intl.DateTimeFormat("pt-BR", {
    month: "long",
    year: "numeric",
  }).format(date);
}

function comparePeriodIds(a, b) {
  return a.localeCompare(b);
}

function normalizeList(input) {
  if (!input) {
    return [];
  }
  return String(input)
    .split(",")
    .map((item) => item.trim())
    .filter(Boolean);
}

function formatList(items) {
  return Array.isArray(items) && items.length ? items.join(", ") : "-";
}

function createEmptyPeriodNotes() {
  return {
    generalNotes: "",
    collaborators: {},
  };
}

function normalizeOrientation(raw) {
  return {
    id: raw?.id || generateId("orientation"),
    text: raw?.text?.toString().trim() || "",
    priority: PRIORITY_META[raw?.priority] ? raw.priority : "medium",
    dueDate: raw?.dueDate || "",
    status: ORIENTATION_STATUS_META[raw?.status] ? raw.status : "not_started",
    createdAt: raw?.createdAt || nowIso(),
    updatedAt: raw?.updatedAt || raw?.createdAt || nowIso(),
  };
}

function normalizeOrientationList(raw) {
  if (Array.isArray(raw)) {
    return raw.map(normalizeOrientation);
  }
  const text = raw?.toString().trim() || "";
  return text ? [normalizeOrientation({ text })] : [];
}

function normalizeCollaboratorPeriodNote(raw) {
  const orientationSource = Array.isArray(raw?.guidanceItems)
    ? raw.guidanceItems
    : Array.isArray(raw?.orientations)
      ? raw.orientations
      : raw?.guidance || "";
  return {
    score: raw?.score?.toString().trim() || "",
    note: raw?.note?.toString().trim() || "",
    themes: Array.isArray(raw?.themes) ? raw.themes.join(", ") : raw?.themes?.toString().trim() || "",
    guidanceItems: normalizeOrientationList(orientationSource),
  };
}

function hasCollaboratorPeriodNoteContent(raw) {
  const note = normalizeCollaboratorPeriodNote(raw);
  return Boolean(
    note.score ||
      note.note ||
      note.themes ||
      note.guidanceItems.some((item) => item.text)
  );
}

function formatOrientationSummaryText(raw) {
  const items = normalizeOrientationList(raw).filter((item) => item.text);
  if (!items.length) {
    return "";
  }
  return items
    .map((item) => {
      const meta = [
        `Prioridade ${PRIORITY_META[item.priority]?.label || item.priority}`,
        `Status ${ORIENTATION_STATUS_META[item.status]?.label || item.status}`,
        item.dueDate ? `Prazo ${formatDate(item.dueDate)}` : "",
      ]
        .filter(Boolean)
        .join(" | ");
      return `${item.text}${meta ? ` (${meta})` : ""}`;
    })
    .join("\n");
}

function renderOrientationSummaryHtml(raw, emptyMessage = "Sem orientacoes registradas.") {
  const items = normalizeOrientationList(raw).filter((item) => item.text);
  if (!items.length) {
    return `<div class="orientation-empty"><p>${escapeHtml(emptyMessage)}</p></div>`;
  }
  return `
    <div class="orientation-list">
      ${items
        .map((item) => {
          const priority = PRIORITY_META[item.priority] || PRIORITY_META.medium;
          const status = ORIENTATION_STATUS_META[item.status] || ORIENTATION_STATUS_META.not_started;
          return `
            <article class="orientation-card orientation-card--summary">
              <div class="orientation-card__header">
                <strong>${escapeHtml(item.text)}</strong>
                <div class="list-card__actions">
                  <span class="priority-pill" data-tone="${escapeHtml(priority.tone)}">${escapeHtml(priority.label)}</span>
                  <span class="status-pill" data-tone="${escapeHtml(status.tone)}">${escapeHtml(status.label)}</span>
                </div>
              </div>
              <div class="orientation-card__meta">
                <span>Prazo: ${escapeHtml(item.dueDate ? formatDate(item.dueDate) : "Sem prazo")}</span>
              </div>
            </article>
          `;
        })
        .join("")}
    </div>
  `;
}

function getEmailText(value, fallback = "-") {
  const trimmed = value?.toString().trim();
  return trimmed || fallback;
}

function renderEmailText(value, fallback = "-") {
  return escapeHtml(getEmailText(value, fallback)).replace(/\n/g, "<br>");
}

function renderEmailShell(title, subtitle = "", contentHtml = "") {

function renderEmailSection(title, contentHtml) {
  return `

function renderEmailField(label, value, { multiline = false, fallback = "-" } = {}) {
  const renderedValue = multiline ? renderEmailText(value, fallback) : escapeHtml(getEmailText(value, fallback));
  return `
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;margin:0 0 12px;">
      <tr>
        <td style="padding:14px 16px;border:1px solid #dde5dd;border-radius:16px;background:#ffffff;">

function renderEmailNote(text) {

        <td style="padding:15px 18px;border-left:4px solid #174c44;border-radius:16px;background:#f4f7f4;color:#53645d;font-size:14px;line-height:1.7;">

function renderEmailCard(title, subtitle = "", contentHtml = "") {

function renderEmailOrientationList(items, emptyMessage = "Sem orientacoes registradas.") {
  if (!items.length) {
    return `
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;">
        <tr>
          <td style="padding:14px 16px;border:1px dashed #cfd9cf;border-radius:16px;background:#fbfcfa;color:#5f6d66;font-size:14px;line-height:1.6;">

          </td>
        </tr>
      </table>
    `;
  }

  return items
    .map((item, index) => {
      const priority = PRIORITY_META[item.priority]?.label || item.priority;
      const status = ORIENTATION_STATUS_META[item.status]?.label || item.status;
      const deadline = item.dueDate ? formatDate(item.dueDate) : "Sem prazo";
      return `
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;margin:0 0 12px;">
          <tr>

              <div style="margin:0 0 10px;font-size:17px;line-height:1.4;font-weight:700;color:#143b33;">

              <div style="margin:0 0 6px;font-size:14px;line-height:1.6;color:#31423a;"><strong>Prazo:</strong> ${escapeHtml(deadline)}</div>
              <div style="font-size:14px;line-height:1.6;color:#31423a;"><strong>Status:</strong> ${escapeHtml(status)}</div>
            </td>
          </tr>
        </table>
      `;

}

function buildDataAttributes(attributes = {}) {
  return Object.entries(attributes)
    .filter(([, value]) => value !== undefined && value !== null && value !== false && value !== "")
    .map(([key, value]) => `data-${key}="${escapeHtml(String(value))}"`)
    .join(" ");
}

function renderInlineIcon(name) {
  const icons = {
    add: `<span class="ui-icon ui-icon--add" aria-hidden="true"></span>`,
    save: `<span class="ui-icon ui-icon--save" aria-hidden="true"></span>`,
    edit: `<span class="ui-icon ui-icon--edit" aria-hidden="true"></span>`,
    copy: `<span class="ui-icon ui-icon--copy" aria-hidden="true"></span>`,
    mail: `<span class="ui-icon ui-icon--mail" aria-hidden="true"></span>`,
    trash: `<span class="ui-icon ui-icon--trash" aria-hidden="true"></span>`,
    collapse: `<span class="ui-icon ui-icon--collapse" aria-hidden="true"></span>`,
    expand: `<span class="ui-icon ui-icon--expand" aria-hidden="true"></span>`,
  };
  return icons[name] || "";
}

function createDefaultState() {
  const activePeriod = getCurrentPeriodId();
  return {
    version: 1,
    settings: {
      activePeriod,
      sidebarCollapsed: false,
      emailIntegrationUrl: "",
      emailIntegrationToken: "",
      periodSummaryRecipient: "",
      agendaEmailRecipient: "",
    },
    periods: {},
    collaborators: [],
    items: [],
    periodNotes: {},
  };
}

function normalizeCollaborator(raw) {
  return {
    id: raw?.id || generateId("collab"),
    name: raw?.name || "",
    role: raw?.role || "",
    email: raw?.email || "",
    themes: Array.isArray(raw?.themes) ? raw.themes : normalizeList(raw?.themes || ""),
    guidance: raw?.guidance || "",
    active: raw?.active !== false,
    createdAt: raw?.createdAt || nowIso(),
    updatedAt: raw?.updatedAt || raw?.createdAt || nowIso(),
  };
}

function normalizeItem(raw) {
  const id = raw?.id || generateId("item");
  return {
    id,
    kind: raw?.kind === "agenda" ? "agenda" : "task",
    periodId: raw?.periodId || getCurrentPeriodId(),
    title: raw?.title || "",
    description: raw?.description || "",
    observations: raw?.observations || "",
    collaboratorId: raw?.collaboratorId || "",
    responsibleId: raw?.responsibleId || "",
    priority: PRIORITY_META[raw?.priority] ? raw.priority : "medium",
    status: STATUS_META[raw?.status] ? raw.status : "pending",
    referenceDate: raw?.referenceDate || "",
    dueDate: raw?.dueDate || "",
    themes: Array.isArray(raw?.themes) ? raw.themes : normalizeList(raw?.themes || ""),
    attachmentRefs: Array.isArray(raw?.attachmentRefs)
      ? raw.attachmentRefs.map((attachment) => ({
          id: attachment?.id || generateId("att"),
          name: attachment?.name || "Arquivo",
          type: attachment?.type || "application/octet-stream",
          size: safeNumber(attachment?.size),
        }))
      : [],
    sourceItemId: raw?.sourceItemId || "",
    copiedFromId: raw?.copiedFromId || "",
    carryRootId: raw?.carryRootId || id,
    carriedFromPeriodId: raw?.carriedFromPeriodId || "",
    createdAt: raw?.createdAt || nowIso(),
    updatedAt: raw?.updatedAt || raw?.createdAt || nowIso(),
  };
}

function normalizeState(raw) {
  const base = createDefaultState();
  const next = {
    version: 1,
    settings: {
      ...base.settings,
      ...(raw?.settings || {}),
    },
    periods: {},
    collaborators: Array.isArray(raw?.collaborators) ? raw.collaborators.map(normalizeCollaborator) : [],
    items: Array.isArray(raw?.items) ? raw.items.map(normalizeItem) : [],
    periodNotes: {},
  };

  const periodEntries = Object.entries(raw?.periods || {});
  for (const [periodId, value] of periodEntries) {
    next.periods[periodId] = {
      id: periodId,
      createdAt: value?.createdAt || nowIso(),
      preparedAt: value?.preparedAt || null,
      sourcePeriodId: value?.sourcePeriodId || "",
    };
  }

  const noteEntries = Object.entries(raw?.periodNotes || {});
  for (const [periodId, value] of noteEntries) {
    const collaborators = {};
    for (const [collaboratorId, collaboratorValue] of Object.entries(value?.collaborators || {})) {
      collaborators[collaboratorId] = normalizeCollaboratorPeriodNote(collaboratorValue);
    }
    next.periodNotes[periodId] = {
      ...createEmptyPeriodNotes(),
      generalNotes: value?.generalNotes?.toString().trim() || "",
      collaborators,
    };
  }

  if (!next.settings.activePeriod) {
    next.settings.activePeriod = getCurrentPeriodId();
  }

  return next;
}

function requestToPromise(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("Falha na operacao do IndexedDB."));
  });
}

function transactionDone(transaction) {
  return new Promise((resolve, reject) => {
    transaction.oncomplete = () => resolve();
    transaction.onerror = () => reject(transaction.error || new Error("Falha ao finalizar a transacao."));
    transaction.onabort = () => reject(transaction.error || new Error("Transacao abortada."));
  });
}

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(APP_DB_NAME, APP_DB_VERSION);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(STATE_STORE)) {
        db.createObjectStore(STATE_STORE, { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains(ATTACHMENT_STORE)) {
        db.createObjectStore(ATTACHMENT_STORE, { keyPath: "id" });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("Nao foi possivel abrir o banco local."));
  });
}

async function loadPersistedState(db) {
  const transaction = db.transaction(STATE_STORE, "readonly");
  const store = transaction.objectStore(STATE_STORE);
  const record = await requestToPromise(store.get(STATE_KEY));
  await transactionDone(transaction);
  return record?.payload || null;
}

async function persistState(db, payload) {
  const transaction = db.transaction(STATE_STORE, "readwrite");
  const store = transaction.objectStore(STATE_STORE);
  store.put({ id: STATE_KEY, payload });
  await transactionDone(transaction);
}

async function putAttachment(db, record) {
  const transaction = db.transaction(ATTACHMENT_STORE, "readwrite");
  const store = transaction.objectStore(ATTACHMENT_STORE);
  store.put(record);
  await transactionDone(transaction);
}

async function getAttachment(db, attachmentId) {
  const transaction = db.transaction(ATTACHMENT_STORE, "readonly");
  const store = transaction.objectStore(ATTACHMENT_STORE);
  const record = await requestToPromise(store.get(attachmentId));
  await transactionDone(transaction);
  return record || null;
}

async function deleteAttachment(db, attachmentId) {
  const transaction = db.transaction(ATTACHMENT_STORE, "readwrite");
  const store = transaction.objectStore(ATTACHMENT_STORE);
  store.delete(attachmentId);
  await transactionDone(transaction);
}

async function clearAttachments(db) {
  const transaction = db.transaction(ATTACHMENT_STORE, "readwrite");
  const store = transaction.objectStore(ATTACHMENT_STORE);
  store.clear();
  await transactionDone(transaction);
}

async function getAllAttachments(db) {
  const transaction = db.transaction(ATTACHMENT_STORE, "readonly");
  const store = transaction.objectStore(ATTACHMENT_STORE);
  const records = await requestToPromise(store.getAll());
  await transactionDone(transaction);
  return Array.isArray(records) ? records : [];
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Nao foi possivel converter o arquivo do backup."));
    reader.readAsDataURL(blob);
  });
}

function dataUrlToBlob(dataUrl, fallbackType = "application/octet-stream") {
  if (!dataUrl?.includes(",")) {
    return new Blob([], { type: fallbackType });
  }
  const [meta, payload] = dataUrl.split(",");
  const mimeMatch = meta.match(/data:(.*?);base64/);
  const mimeType = mimeMatch?.[1] || fallbackType;
  const bytes = Uint8Array.from(atob(payload), (char) => char.charCodeAt(0));
  return new Blob([bytes], { type: mimeType });
}

function dataUrlToBase64(dataUrl) {
  if (!dataUrl?.includes(",")) {
    return "";
  }
  return dataUrl.split(",")[1] || "";
}

function downloadBlob(filename, blob) {
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = filename;
  document.body.append(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2_000);
}

function buildCsv(rows) {
  return rows
    .map((row) =>
      row
        .map((value) => `"${String(value ?? "").replaceAll('"', '""')}"`)
        .join(";")
    )
    .join("\n");
}

function getItemAnchorDate(item) {
  return item.referenceDate || item.dueDate || item.updatedAt.slice(0, 10) || item.createdAt.slice(0, 10);
}

function getWeekBounds(dateInput) {
  const date = new Date(`${dateInput || todayIsoDate()}T12:00:00`);
  const day = date.getDay();
  const diffToMonday = day === 0 ? -6 : 1 - day;
  const start = new Date(date);
  start.setDate(date.getDate() + diffToMonday);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  return {
    start: start.toISOString().slice(0, 10),
    end: end.toISOString().slice(0, 10),
  };
}

function dateWithinRange(dateValue, start, end) {
  if (!dateValue) {
    return false;
  }
  return dateValue >= start && dateValue <= end;
}

function isOpenStatus(status) {
  return OPEN_STATUSES.has(status);
}

function sortItemsByPriorityAndDate(items) {
  const priorityRank = { high: 0, medium: 1, low: 2 };
  return [...items].sort((left, right) => {
    const leftOpen = isOpenStatus(left.status) ? 0 : 1;
    const rightOpen = isOpenStatus(right.status) ? 0 : 1;
    if (leftOpen !== rightOpen) {
      return leftOpen - rightOpen;
    }
    const leftPriority = priorityRank[left.priority] ?? 9;
    const rightPriority = priorityRank[right.priority] ?? 9;
    if (leftPriority !== rightPriority) {
      return leftPriority - rightPriority;
    }
    return getItemAnchorDate(left).localeCompare(getItemAnchorDate(right));
  });
}

class TributaryCoordinatorApp {

        priority: "all",
        visibility: "open",
      },
      agendaFilters: {
        query: "",
        status: "all",

        priority: "all",
        visibility: "open",
      },
      reportFilters: {
        periodId: getCurrentPeriodId(),
        scope: "month",
        weekDate: todayIsoDate(),
        context: "all",

      copyModal: {
        open: false,

      void this.safeRun(async () => this.handleClick(event));
    };
    this.boundHandleChange = (event) => {
      void this.safeRun(async () => this.handleChange(event));
    };
    this.boundHandleInput = (event) => {
      void this.safeRun(async () => this.handleInput(event));
    };
    this.boundHandleSubmit = (event) => {
      void this.safeRun(async () => this.handleSubmit(event));
    };
    this.boundHandleToggle = (event) => {
      this.handleToggle(event);
    };
  }

  async init() {
    if (!("indexedDB" in window)) {
      throw new Error("Seu navegador nao oferece IndexedDB. Use Chrome ou Edge localmente para este app.");
    }
    this.db = await openDatabase();
    const persisted = await loadPersistedState(this.db);
    this.state = normalizeState(persisted);
    this.ensurePeriodStructures(this.state.settings.activePeriod);
    if (!this.state.periods[this.state.settings.activePeriod].preparedAt) {
      await this.preparePeriod(this.state.settings.activePeriod, { silent: true });
    }
    this.ui.reportFilters.periodId = this.state.settings.activePeriod;
    this.bindRootEvents();
    this.render();
  }

  bindRootEvents() {
    this.root.addEventListener("click", this.boundHandleClick);
    this.root.addEventListener("change", this.boundHandleChange);
    this.root.addEventListener("input", this.boundHandleInput);
    this.root.addEventListener("submit", this.boundHandleSubmit);
    this.root.addEventListener("toggle", this.boundHandleToggle, true);
  }

  async safeRun(task) {
    try {
      await task();
    } catch (error) {
      console.error(error);
      this.pushToast(error?.message || "Algo falhou durante a operacao.", "error");
    }
  }

  handleToggle(event) {
    const target = event.target;
    if (!(target instanceof HTMLDetailsElement)) {
      return;
    }
    const group = target.dataset.collapseGroup;
    const collapseId = target.dataset.collapseId;
    if (!group || !collapseId) {
      return;
    }
    this.setCardCollapsed(group, collapseId, !target.open);
  }

  isCardCollapsed(group, collapseId) {
    return Boolean(this.ui.collapsedCards[group]?.[collapseId]);
  }

  setCardCollapsed(group, collapseId, collapsed) {
    if (!this.ui.collapsedCards[group]) {
      this.ui.collapsedCards[group] = {};
    }
    this.ui.collapsedCards[group][collapseId] = collapsed;
  }

  setCollapseGroup(group, collapsed) {
    const cards = Array.from(this.root.querySelectorAll(`details[data-collapse-group="${group}"]`));
    for (const card of cards) {
      if (!(card instanceof HTMLDetailsElement)) {
        continue;
      }
      this.setCardCollapsed(group, card.dataset.collapseId || "", collapsed);
      card.open = !collapsed;
    }
  }

  renderCollapseGroupActions(group, count) {
    if (!count) {
      return "";
    }
    return `
      <div class="section-actions">
        <button type="button" class="quiet-button" data-action="set-collapse-group" data-collapse-group="${escapeHtml(group)}" data-collapse-state="collapsed">

        <button type="button" class="quiet-button" data-action="set-collapse-group" data-collapse-group="${escapeHtml(group)}" data-collapse-state="expanded">
          Expandir todos

      </div>

  renderCompactActionButton({ label, attributes = {}, className = "quiet-button compact-action-button", disabled = false }) {
    return `
      <button

        class="${className}"
        title="${escapeHtml(label)}"
        aria-label="${escapeHtml(label)}"

        ${disabled ? "disabled" : ""}

  renderIconActionButton({ icon, label, attributes = {}, className = "orientation-icon-button", disabled = false }) {
    return `
      <button
        type="button"
        class="${className} orientation-icon-button--${icon}"
        title="${escapeHtml(label)}"

        type="button"

  renderCollapsibleCard({ group, collapseId, cardClass, summary, body }) {
    const collapsed = this.isCardCollapsed(group, collapseId);
    return `
      <details
        class="${cardClass} collapsible-card ${collapsed ? "is-collapsed" : ""}"
        data-collapse-group="${escapeHtml(group)}"

          ${body}
        </div>
      </details>
