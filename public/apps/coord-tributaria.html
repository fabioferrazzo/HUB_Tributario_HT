  focusOrientationField(collaboratorId, orientationId) {
    window.requestAnimationFrame(() => {
      const input = this.root.querySelector(
        `[data-orientation-collaborator="${collaboratorId}"][data-orientation-field="id"][value="${orientationId}"]`
      );
      const index = input?.dataset.orientationIndex;
      if (!index) {
        return;
      }
      const textarea = this.root.querySelector(
        `[data-orientation-collaborator="${collaboratorId}"][data-orientation-index="${index}"][data-orientation-field="text"]`
      );
      if (textarea instanceof HTMLTextAreaElement) {
        textarea.focus();
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
      }
    });
  }

  ensurePeriodStructures(periodId) {
    if (!this.state.periods[periodId]) {
      this.state.periods[periodId] = {
        id: periodId,
        createdAt: nowIso(),
        preparedAt: null,
        sourcePeriodId: "",
      };
    }
    if (!this.state.periodNotes[periodId]) {
      this.state.periodNotes[periodId] = createEmptyPeriodNotes();
    }
  }

  getLatestPreviousPeriod(periodId) {
    return this.getKnownPeriods()
      .filter((candidate) => candidate < periodId)
      .sort(comparePeriodIds)
      .at(-1) || "";
  }

  async preparePeriod(periodId, options = {}) {
    this.ensurePeriodStructures(periodId);
    const period = this.state.periods[periodId];
    if (!period.preparedAt) {
      const sourcePeriodId = this.getLatestPreviousPeriod(periodId);
      if (sourcePeriodId) {
        const carryItems = this.state.items.filter(
          (item) => item.periodId === sourcePeriodId && isOpenStatus(item.status)
        );
        for (const item of carryItems) {
          const rootId = item.carryRootId || item.id;
          const alreadyExists = this.state.items.some(
            (candidate) => candidate.periodId === periodId && (candidate.carryRootId || candidate.id) === rootId
          );
          if (alreadyExists) {
            continue;
          }
          this.state.items.push({
            ...item,
            id: generateId("item"),
            periodId,
            sourceItemId: item.id,
            copiedFromId: item.copiedFromId || "",
            carryRootId: rootId,
            carriedFromPeriodId: sourcePeriodId,
            createdAt: nowIso(),
            updatedAt: nowIso(),
          });
        }
        period.sourcePeriodId = sourcePeriodId;
      }
      period.preparedAt = nowIso();
    }
    if (options.activate !== false) {
      this.state.settings.activePeriod = periodId;
      this.ui.reportFilters.periodId = periodId;
    }
    this.ensurePeriodStructures(periodId);
    await this.persistState();
    if (!options.silent) {
      this.pushToast(`Periodo ${formatPeriodLabel(periodId)} pronto para uso.`);
    }
  }

  getKnownPeriods() {
    const periodSet = new Set([
      ...Object.keys(this.state.periods || {}),
      ...Object.keys(this.state.periodNotes || {}),
      ...this.state.items.map((item) => item.periodId),
    ]);
    if (!periodSet.size) {
      periodSet.add(this.state.settings.activePeriod || getCurrentPeriodId());
    }
    return [...periodSet].sort(comparePeriodIds);
  }

  getPeriodNotes(periodId = this.state.settings.activePeriod) {
    this.ensurePeriodStructures(periodId);
    return this.state.periodNotes[periodId];
  }

  getCollaboratorPeriodNote(collaboratorId, periodId = this.state.settings.activePeriod) {
    const notes = this.getPeriodNotes(periodId);
    notes.collaborators = notes.collaborators || {};
    notes.collaborators[collaboratorId] = normalizeCollaboratorPeriodNote(notes.collaborators[collaboratorId]);
    return notes.collaborators[collaboratorId];
  }

  captureNotesDraftFromForm(form = this.root.querySelector("#notes-form")) {
    if (!(form instanceof HTMLFormElement)) {
      return this.getPeriodNotes();
    }
    const formData = new FormData(form);
    const notes = this.getPeriodNotes();
    notes.generalNotes = formData.get("generalNotes")?.toString().trim() || "";
    notes.generalScore = "";
    notes.meetingHighlights = "";
    notes.sharedGuidance = "";
    notes.collaborators = notes.collaborators || {};

    for (const collaborator of this.getCollaborators()) {
      const current = this.getCollaboratorPeriodNote(collaborator.id);
      const existingItems = new Map(current.guidanceItems.map((item) => [item.id, item]));
      const idInputs = Array.from(
        form.querySelectorAll(
          `[data-orientation-collaborator="${collaborator.id}"][data-orientation-field="id"]`
        )
      );
      const guidanceItems = idInputs
        .map((input) => {
          const index = input.dataset.orientationIndex || "";
          const textInput = form.querySelector(
            `[data-orientation-collaborator="${collaborator.id}"][data-orientation-index="${index}"][data-orientation-field="text"]`
          );
          const priorityInput = form.querySelector(
            `[data-orientation-collaborator="${collaborator.id}"][data-orientation-index="${index}"][data-orientation-field="priority"]`
          );
          const dueDateInput = form.querySelector(
            `[data-orientation-collaborator="${collaborator.id}"][data-orientation-index="${index}"][data-orientation-field="dueDate"]`
          );
          const statusInput = form.querySelector(
            `[data-orientation-collaborator="${collaborator.id}"][data-orientation-index="${index}"][data-orientation-field="status"]`
          );
          const base = existingItems.get(input.value) || {};
          const textValue = textInput ? textInput.value : base.text || "";
          const priorityValue = priorityInput ? priorityInput.value : base.priority || "medium";
          const dueDateValue = dueDateInput ? dueDateInput.value : base.dueDate || "";
          const statusValue = statusInput ? statusInput.value : base.status || "not_started";
          return normalizeOrientation({
            ...base,
            id: input.value || generateId("orientation"),
            text: textValue,
            priority: priorityValue,
            dueDate: dueDateValue,
            status: statusValue,
            updatedAt: nowIso(),
          });
        });

      notes.collaborators[collaborator.id] = normalizeCollaboratorPeriodNote({
        ...current,
        score: formData.get(`score-${collaborator.id}`)?.toString().trim() || "",
        note: formData.get(`note-${collaborator.id}`)?.toString().trim() || "",
        themes: formData.get(`themes-${collaborator.id}`)?.toString().trim() || "",
        guidanceItems,
      });
    }

    return notes;
  }

  getCollaborators(includeInactive = true) {
    const list = [...this.state.collaborators].sort((left, right) => {
      if (left.active !== right.active) {
        return left.active ? -1 : 1;
      }
      return left.name.localeCompare(right.name);
    });
    return includeInactive ? list : list.filter((item) => item.active);
  }

  getCollaboratorById(collaboratorId) {
    return this.state.collaborators.find((item) => item.id === collaboratorId) || null;
  }

  getCollaboratorName(collaboratorId) {
    if (!collaboratorId) {
      return "-";
    }
    return this.getCollaboratorById(collaboratorId)?.name || "Colaborador removido";
  }

  buildCollaboratorReminderPayload(collaboratorId, periodId = this.state.settings.activePeriod) {
    const collaborator = this.getCollaboratorById(collaboratorId);
    if (!collaborator) {
      throw new Error("Colaborador nao encontrado.");
    }
    if (!collaborator.email) {
      throw new Error("Cadastre um e-mail do colaborador para enviar o lembrete.");
    }

    const note = this.getCollaboratorPeriodNote(collaboratorId, periodId);
    const orientations = normalizeOrientationList(note.guidanceItems).filter((item) => item.text);
    const orientationText = orientations.length
      ? orientations
          .map((item, index) => {
            const priority = PRIORITY_META[item.priority]?.label || item.priority;
            const status = ORIENTATION_STATUS_META[item.status]?.label || item.status;
            const deadline = item.dueDate ? formatDate(item.dueDate) : "Sem prazo";
            return `${index + 1}. ${item.text}\nPrioridade: ${priority}\nPrazo: ${deadline}\nStatus: ${status}`;
          })
          .join("\n\n")
      : "Sem orientacoes registradas.";

    const body = [
      `Ola, ${collaborator.name}.`,
      "",
      `Segue o lembrete referente ao periodo ${formatPeriodLabel(periodId)}.`,
      "",
      "Observacoes individuais:",
      getEmailText(note.note, "Sem observacoes registradas."),
      "",
      "Orientacoes do periodo:",
      orientationText,
    ].join("\n");

    const htmlBody = renderEmailShell(
      `Lembrete de ${collaborator.name}`,
      `Periodo ${formatPeriodLabel(periodId)}`,
      `
        ${renderEmailNote(`Segue o lembrete referente ao periodo ${formatPeriodLabel(periodId)}.`)}
        ${renderEmailSection(
          "Observacoes individuais",
          renderEmailField("Observacoes", note.note, { multiline: true, fallback: "Sem observacoes registradas." })
        )}
        ${renderEmailSection(
          "Orientacoes do periodo",
          renderEmailOrientationList(orientations, "Sem orientacoes registradas.")
        )}
      `
    );

    const subject = `Lembrete | ${collaborator.name} | ${formatPeriodLabel(periodId)}`;
    return {
      to: collaborator.email,
      subject,
      body,
      htmlBody,
      collaboratorName: collaborator.name,
      periodId,
      periodLabel: formatPeriodLabel(periodId),
    };
  }

  async dispatchReminderThroughAppsScript(payload) {
    const testHooks = globalThis.__APP_TEST_HOOKS__;
    if (testHooks && typeof testHooks.dispatchEmail === "function") {
      const testResult = await testHooks.dispatchEmail(payload);
      if (testResult && typeof testResult === "object" && testResult.ok === false) {
        throw new Error(testResult.message || "Falha simulada no envio de e-mail.");
      }
      return;
    }

    const endpointUrl = this.state.settings.emailIntegrationUrl?.toString().trim() || "";
    if (!endpointUrl) {
      throw new Error("Configure a URL do Google Apps Script na lateral do app antes de enviar.");
    }

    await new Promise((resolve, reject) => {
      try {
        const frameName = `mail-dispatch-${Date.now()}`;
        const iframe = document.createElement("iframe");
        iframe.name = frameName;
        iframe.hidden = true;
        iframe.setAttribute("aria-hidden", "true");

        const form = document.createElement("form");
        form.method = "POST";
        form.action = endpointUrl;
        form.target = frameName;
        form.style.display = "none";

        const fields = {
          token: this.state.settings.emailIntegrationToken?.toString().trim() || "",
          to: payload.to,
          subject: payload.subject,
          body: payload.body,
          htmlBody: payload.htmlBody,
          attachmentsJson: payload.attachments?.length ? JSON.stringify(payload.attachments) : "",
          collaboratorName: payload.collaboratorName,
          periodId: payload.periodId,
          periodLabel: payload.periodLabel,
          sourceApp: "coord-tributaria-local",
        };

        Object.entries(fields).forEach(([name, value]) => {
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = name;
          input.value = value || "";
          form.appendChild(input);
        });

        const cleanup = () => {
          window.setTimeout(() => {
            iframe.remove();
            form.remove();
          }, 1200);
        };

        let settled = false;
        const settle = (callback) => {
          if (settled) {
            return;
          }
          settled = true;
          cleanup();
          callback();
        };

        iframe.addEventListener(
          "load",
          () => {
            settle(resolve);
          },
          { once: true }
        );

        document.body.append(iframe, form);
        form.submit();

        window.setTimeout(() => {
          settle(resolve);
        }, 900);
      } catch (error) {
        reject(error);
      }
    });
  }

  buildPeriodSummaryEmailPayload(recipientEmail, mode = "general_and_collaborators", periodId = this.state.settings.activePeriod) {
    const trimmedRecipient = recipientEmail?.toString().trim() || "";
    if (!trimmedRecipient) {
      throw new Error("Informe o e-mail de destino para enviar o resumo do periodo.");
    }

    const notes = this.getPeriodNotes(periodId);
    const generalNotes = notes.generalNotes?.trim() || "Sem notas gerais registradas.";
    const collaboratorEntries = this.getCollaborators()
      .map((collaborator) => {
        const note = this.getCollaboratorPeriodNote(collaborator.id, periodId);
        const openOrientations = normalizeOrientationList(note.guidanceItems).filter(
          (item) => item.text && EMAIL_OPEN_ORIENTATION_STATUSES.has(item.status)
        );
        const hasSummaryContent = Boolean(note.score || note.note || note.themes || openOrientations.length);
        return {
          collaborator,
          note,
          openOrientations,
          hasSummaryContent,
        };
      })
      .filter((entry) => entry.hasSummaryContent);

    const collaboratorSections = collaboratorEntries.length
      ? collaboratorEntries
          .map((entry) => {
            const lines = [
              `${entry.collaborator.name}${entry.collaborator.role ? ` | ${entry.collaborator.role}` : ""}`,
              `Nota: ${entry.note.score || "-"}`,
              `Temas do periodo: ${entry.note.themes || "-"}`,
              "",
              "Observacoes individuais:",
              getEmailText(entry.note.note, "Sem observacoes registradas."),
            ];

            if (entry.openOrientations.length) {
              lines.push("", "Orientacoes em aberto:");
              entry.openOrientations.forEach((item, index) => {
                const priority = PRIORITY_META[item.priority]?.label || item.priority;
                const status = ORIENTATION_STATUS_META[item.status]?.label || item.status;
                const deadline = item.dueDate ? formatDate(item.dueDate) : "Sem prazo";
                lines.push(
                  `${index + 1}. ${item.text}`,
                  `Prioridade: ${priority}`,
                  `Prazo: ${deadline}`,
                  `Status: ${status}`
                );
              });
            } else {
              lines.push("", "Orientacoes em aberto: nenhuma.");
            }

            return lines.join("\n");
          })
          .join("\n\n------------------------------\n\n")
      : "Nenhum colaborador com informacoes preenchidas para este envio.";

    const bodySections = [`Resumo do periodo ${formatPeriodLabel(periodId)}`];

    if (mode !== "collaborators_only") {
      bodySections.push("", "Notas gerais do periodo:", generalNotes);
    }

    if (mode !== "general_only") {
      bodySections.push("", "Detalhamento por colaborador:", collaboratorSections);
    }

    const subjectMap = {
      general_only: `Notas gerais do periodo | ${formatPeriodLabel(periodId)}`,
      collaborators_only: `Resumo dos colaboradores | ${formatPeriodLabel(periodId)}`,
      general_and_collaborators: `Resumo do periodo e colaboradores | ${formatPeriodLabel(periodId)}`,
    };

    const htmlSections = [];
    if (mode !== "collaborators_only") {
      htmlSections.push(
        renderEmailSection(
          "Notas gerais do periodo",
          renderEmailField("Resumo do periodo", generalNotes, { multiline: true, fallback: "Sem notas gerais registradas." })
        )
      );
    }

    if (mode !== "general_only") {
      const collaboratorHtml = collaboratorEntries.length
        ? collaboratorEntries
            .map((entry) =>
              renderEmailCard(
                entry.collaborator.name,
                entry.collaborator.role || "",
                [
                  renderEmailField("Nota", entry.note.score || "-"),
                  renderEmailField("Temas do periodo", entry.note.themes || "-"),
                  renderEmailField("Observacoes individuais", entry.note.note, {
                    multiline: true,
                    fallback: "Sem observacoes registradas.",
                  }),
                  `
                    <div style="margin:0 0 8px;">
                      <div style="margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#66756e;">
                        Orientacoes em aberto
                      </div>
                      ${renderEmailOrientationList(entry.openOrientations, "Nenhuma orientacao em aberto registrada.")}
                    </div>
                  `,
                ].join("")
              )
            )
            .join("")
        : renderEmailNote("Nenhum colaborador com informacoes preenchidas para este envio.");

      htmlSections.push(renderEmailSection("Detalhamento por colaborador", collaboratorHtml));
    }

    const htmlBody = renderEmailShell(
      mode === "general_only" ? "Notas gerais do periodo" : "Resumo do periodo e colaboradores",
      `Referencia ${formatPeriodLabel(periodId)}`,
      htmlSections.join("")
    );

    return {
      to: trimmedRecipient,
      subject: subjectMap[mode] || subjectMap.general_and_collaborators,
      body: bodySections.join("\n"),
      htmlBody,
      collaboratorName: "Resumo do periodo",
      periodId,
      periodLabel: formatPeriodLabel(periodId),
    };
  }

  async buildAgendaEmailPayload(
    recipientEmail,
    {
      scope = "month",
      weekDate = todayIsoDate(),
    } = {},
    periodId = this.state.settings.activePeriod
  ) {
    const trimmedRecipient = recipientEmail?.toString().trim() || "";
    if (!trimmedRecipient) {
      throw new Error("Informe o e-mail de destino para enviar as pautas.");
    }

    let items = this.getCurrentPeriodItems("agenda", this.ui.agendaFilters);
    let rangeLabel = formatPeriodLabel(periodId);

    if (scope === "week") {
      const bounds = getWeekBounds(weekDate || todayIsoDate());
      items = items.filter((item) => dateWithinRange(getItemAnchorDate(item), bounds.start, bounds.end));
      rangeLabel = `${formatDate(bounds.start)} ate ${formatDate(bounds.end)}`;
    }

    if (!items.length) {
      throw new Error("Nenhuma pauta encontrada com os filtros atuais para esse envio.");
    }

    const attachments = await this.buildAgendaEmailAttachments(items);

    const body = [
      `Pautas e topicos do periodo ${rangeLabel}`,
      "",
      "Este envio respeita os filtros atuais da tela de pautas.",
      "",
      ...items.flatMap((item, index) => {
        const responsible = this.getCollaboratorName(item.responsibleId);
        const priority = PRIORITY_META[item.priority]?.label || item.priority;
        const status = STATUS_META[item.status]?.label || item.status;
        const attachmentLabel = item.attachmentRefs.length
          ? item.attachmentRefs.map((attachment) => attachment.name).join(", ")
          : "-";
        return [
          `${index + 1}. ${item.title}`,
          `Responsavel: ${responsible}`,
          `Prioridade: ${priority}`,
          `Status: ${status}`,
          `Data da reuniao: ${formatDate(item.referenceDate)}`,
          `Prazo: ${item.dueDate ? formatDate(item.dueDate) : "Sem prazo"}`,
          `Temas: ${formatList(item.themes)}`,
          `Descricao: ${item.description?.trim() || "-"}`,
          `Observacoes: ${item.observations?.trim() || "-"}`,
          `Anexos: ${attachmentLabel}`,
          "",
        ];
      }),
    ].join("\n");

    const htmlBody = renderEmailShell(
      scope === "week" ? "Pautas da semana" : "Pautas do periodo",
      `Recorte ${rangeLabel}`,
      `
        ${renderEmailNote("Este envio respeita os filtros atuais da tela de pautas.")}
        ${renderEmailSection(
          "Pautas selecionadas",
          items
            .map((item, index) => {
              const responsible = this.getCollaboratorName(item.responsibleId);
              const priority = PRIORITY_META[item.priority]?.label || item.priority;
              const status = STATUS_META[item.status]?.label || item.status;
              const attachmentLabel = item.attachmentRefs.length
                ? item.attachmentRefs.map((attachment) => attachment.name).join(", ")
                : "-";
              return renderEmailCard(
                `${index + 1}. ${item.title}`,
                responsible !== "-" ? `Responsavel: ${responsible}` : "",
                [
                  renderEmailField("Prioridade", priority),
                  renderEmailField("Status", status),
                  renderEmailField("Data da reuniao", formatDate(item.referenceDate)),
                  renderEmailField("Prazo", item.dueDate ? formatDate(item.dueDate) : "Sem prazo"),
                  renderEmailField("Temas", formatList(item.themes)),
                  renderEmailField("Descricao", item.description, { multiline: true }),
                  renderEmailField("Observacoes", item.observations, { multiline: true }),
                  renderEmailField("Anexos", attachmentLabel),
                ].join("")
              );
            })
            .join("")
        )}
      `
    );

    return {
      to: trimmedRecipient,
      subject: scope === "week" ? `Pautas da semana | ${rangeLabel}` : `Pautas do periodo | ${rangeLabel}`,
      body,
      htmlBody,
      attachments,
      collaboratorName: "Pautas do periodo",
      periodId,
      periodLabel: rangeLabel,
    };
  }

  getAgendaFilterSummary() {
    const filters = this.ui.agendaFilters;
    const items = this.getCurrentPeriodItems("agenda", filters);
    const parts = [`${items.length} pauta(s) visivel(is)`];
    const openCount = items.filter((item) => OPEN_STATUSES.has(item.status)).length;
    const overdueCount = items.filter(
      (item) => OPEN_STATUSES.has(item.status) && item.dueDate && item.dueDate < todayIsoDate()
    ).length;
    const withoutResponsibleCount = items.filter((item) => !item.responsibleId).length;

    if (filters.query) {
      parts.push(`Busca: ${filters.query}`);
    }
    if (filters.status !== "all") {
      parts.push(`Status: ${STATUS_META[filters.status]?.label || filters.status}`);
    }
    if (filters.priority !== "all") {
      parts.push(`Prioridade: ${PRIORITY_META[filters.priority]?.label || filters.priority}`);
    }
    if (filters.responsibleId !== "all") {
      parts.push(`Responsavel: ${this.getCollaboratorName(filters.responsibleId)}`);
    }
    parts.push(filters.visibility === "open" ? "Somente abertos" : "Todos os registros");

    return {
      items,
      parts,
      metrics: [
        { label: "Na tela", value: String(items.length) },
        { label: "Em aberto", value: String(openCount) },
        { label: "Atrasadas", value: String(overdueCount) },
        { label: "Sem responsavel", value: String(withoutResponsibleCount) },
      ],
      note: items.length
        ? "Os envios por e-mail usam exatamente a mesma selecao que voce esta vendo nesta tela."
        : "Nenhuma pauta foi encontrada com os filtros atuais. Ajuste os filtros ou cadastre um novo topico.",
    };
  }

  getItemById(itemId) {
    return this.state.items.find((item) => item.id === itemId) || null;
  }

  getCurrentPeriodItems(kind, filters) {
    let items = this.state.items.filter((item) => item.kind === kind && item.periodId === this.state.settings.activePeriod);
    const search = filters.query.trim().toLowerCase();
    if (search) {
      items = items.filter((item) =>
        [
          item.title,
          item.description,
          item.observations,
          item.themes.join(", "),
          this.getCollaboratorName(item.collaboratorId),
          this.getCollaboratorName(item.responsibleId),
        ]
          .join(" ")
          .toLowerCase()
          .includes(search)
      );
    }
    if (filters.status !== "all") {
      items = items.filter((item) => item.status === filters.status);
    }
    if (filters.priority !== "all") {
      items = items.filter((item) => item.priority === filters.priority);
    }
    if (kind === "task" && filters.collaboratorId !== "all") {
      items = items.filter((item) => item.collaboratorId === filters.collaboratorId);
    }
    if (kind === "agenda" && filters.responsibleId !== "all") {
      items = items.filter((item) => item.responsibleId === filters.responsibleId);
    }
    if (filters.visibility === "open") {
      items = items.filter((item) => isOpenStatus(item.status));
    }
    return sortItemsByPriorityAndDate(items);
  }

  getDashboardStats() {
    const periodId = this.state.settings.activePeriod;
    const periodItems = this.state.items.filter((item) => item.periodId === periodId);
    const openItems = periodItems.filter((item) => isOpenStatus(item.status));
    const openTasks = openItems.filter((item) => item.kind === "task");
    const openAgenda = openItems.filter((item) => item.kind === "agenda");
    const completedItems = periodItems.filter((item) => item.status === "done");
    const carriedItems = periodItems.filter((item) => item.carriedFromPeriodId);
    const overdueItems = openItems.filter((item) => item.dueDate && item.dueDate < todayIsoDate());

    const statusCounts = Object.keys(STATUS_META).map((status) => ({
      status,
      label: STATUS_META[status].label,
      value: periodItems.filter((item) => item.status === status).length,
      tone: STATUS_META[status].tone,
    }));

    const focusItems = sortItemsByPriorityAndDate(openItems).slice(0, 8);
    const collaboratorObservations = this.getCollaborators()
      .map((collaborator) => {
        const note = this.getCollaboratorPeriodNote(collaborator.id, periodId);
        const observation = note.note?.toString().trim() || "";
        const orientations = normalizeOrientationList(note.guidanceItems).filter((item) => item.text);
        const orientationEntries = orientations
          .map((item) => ({
            id: item.id,
            title: item.text.trim().split("\n")[0] || item.text.trim(),
            dueDate: item.dueDate || "",
            status: item.status,
          }))
          .sort((left, right) => {
            const leftOpen = EMAIL_OPEN_ORIENTATION_STATUSES.has(left.status) ? 0 : 1;
            const rightOpen = EMAIL_OPEN_ORIENTATION_STATUSES.has(right.status) ? 0 : 1;
            if (leftOpen !== rightOpen) {
              return leftOpen - rightOpen;
            }
            const leftDue = left.dueDate || "9999-12-31";
            const rightDue = right.dueDate || "9999-12-31";
            return leftDue.localeCompare(rightDue) || left.title.localeCompare(right.title);
          });
        const observationPreview = observation
          ? `${observation.replace(/\s+/g, " ").trim().slice(0, 180)}${
              observation.replace(/\s+/g, " ").trim().length > 180 ? "..." : ""
            }`
          : "Sem observacoes individuais registradas neste periodo.";
        return {
          id: collaborator.id,
          name: collaborator.name,
          role: collaborator.role || "Sem funcao cadastrada",
          active: collaborator.active !== false,
          hasObservation: Boolean(observation),
          observation,
          observationPreview,
          orientations: orientationEntries,
          orientationCount: orientationEntries.length,
          openOrientationCount: orientations.filter((item) => EMAIL_OPEN_ORIENTATION_STATUSES.has(item.status)).length,
        };
      })
      .sort(
        (left, right) =>
          Number(right.hasObservation) - Number(left.hasObservation) ||
          Number(right.active) - Number(left.active) ||
          left.name.localeCompare(right.name)
      );

    const orientationStatusOrder = {
      in_progress: 0,
      not_started: 1,
      blocked: 2,
      done: 3,
    };
    const orientationEntries = this.getCollaborators()
      .flatMap((collaborator) => {
        const note = this.getCollaboratorPeriodNote(collaborator.id, periodId);
        return normalizeOrientationList(note.guidanceItems)
          .filter((item) => item.text)
          .map((item) => ({
            id: item.id,
            collaboratorId: collaborator.id,
            collaboratorName: collaborator.name,
            title: item.text.trim().split("\n")[0] || item.text.trim(),
            priority: item.priority,
            status: item.status,
            dueDate: item.dueDate || "",
          }));
      })
      .sort((left, right) => {
        const leftStatus = orientationStatusOrder[left.status] ?? 9;
        const rightStatus = orientationStatusOrder[right.status] ?? 9;
        if (leftStatus !== rightStatus) {
          return leftStatus - rightStatus;
        }
        const leftPriority = { high: 0, medium: 1, low: 2 }[left.priority] ?? 9;
        const rightPriority = { high: 0, medium: 1, low: 2 }[right.priority] ?? 9;
        if (leftPriority !== rightPriority) {
          return leftPriority - rightPriority;
        }
        const leftDue = left.dueDate || "9999-12-31";
        const rightDue = right.dueDate || "9999-12-31";
        return leftDue.localeCompare(rightDue) || left.collaboratorName.localeCompare(right.collaboratorName);
      });

    const orientationStatusCounts = Object.keys(ORIENTATION_STATUS_META).map((status) => ({
      status,
      label: ORIENTATION_STATUS_META[status].label,
      value: orientationEntries.filter((item) => item.status === status).length,
      tone: ORIENTATION_STATUS_META[status].tone,
    }));

    const agendaEntries = sortItemsByPriorityAndDate(periodItems.filter((item) => item.kind === "agenda")).slice(0, 8);
    const agendasWithAttachments = agendaEntries.filter((item) => (item.attachmentRefs?.length || 0) > 0).length;

    return {
      total: periodItems.length,
      open: openItems.length,
      openTasks: openTasks.length,
      openAgenda: openAgenda.length,
      completed: completedItems.length,
      carried: carriedItems.length,
      overdue: overdueItems.length,
      statusCounts,
      focusItems,
      collaboratorObservations,
      agendaEntries,
      agendasWithAttachments,
      orientationEntries,
      orientationStatusCounts,
    };
  }

  getItemOwnerName(item) {
    return item.kind === "task"
      ? this.getCollaboratorName(item.collaboratorId)
      : this.getCollaboratorName(item.responsibleId);
  }

  async buildAgendaEmailAttachments(items) {
    const attachments = [];
    for (const item of items) {
      for (const attachment of item.attachmentRefs || []) {
        const record = await getAttachment(this.db, attachment.id);
        if (!record?.blob) {
          continue;
        }
        const dataUrl = await blobToDataUrl(record.blob);
        const contentBase64 = dataUrlToBase64(dataUrl);
        if (!contentBase64) {
          continue;
        }
        attachments.push({
          id: attachment.id,
          itemId: item.id,
          itemTitle: item.title,
          name: attachment.name || record.name || "Arquivo",
          type: attachment.type || record.type || "application/octet-stream",
          size: attachment.size || record.size || 0,
          contentBase64,
        });
      }
    }
    return attachments;
  }

  openDashboardItem(itemId) {
    const item = this.getItemById(itemId);
    if (!item) {
      throw new Error("Registro nao encontrado para abrir no dashboard.");
    }

    if (item.kind === "task") {
      this.ui.activeView = "tasks";
      this.ui.editingTaskId = item.id;
      this.ui.taskFilters = {
        ...this.ui.taskFilters,
        query: item.title,
        status: "all",
        collaboratorId: "all",
        priority: "all",
        visibility: "all",
      };
      this.setCardCollapsed("tasks", item.id, false);
    } else {
      this.ui.activeView = "agenda";
      this.ui.editingAgendaId = item.id;
      this.ui.agendaFilters = {
        ...this.ui.agendaFilters,
        query: item.title,
        status: "all",
        responsibleId: "all",
        priority: "all",
        visibility: "all",
      };
      this.setCardCollapsed("agenda", item.id, false);
    }
    this.render();
  }

  openDashboardNote(collaboratorId, orientationId = "") {
    const collaborator = this.getCollaboratorById(collaboratorId);
    if (!collaborator) {
      throw new Error("Colaborador nao encontrado para abrir no dashboard.");
    }

    this.ui.activeView = "notes";
    this.setCardCollapsed("notes", collaboratorId, false);
    if (orientationId) {
      this.setCardCollapsed("orientation-items", `${collaboratorId}:${orientationId}`, false);
    }
    this.render();

    window.requestAnimationFrame(() => {
      const noteCard = this.root.querySelector(`details[data-collapse-group="notes"][data-collapse-id="${collaboratorId}"]`);
      if (noteCard instanceof HTMLElement) {
        noteCard.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      if (orientationId) {
        this.focusOrientationField(collaboratorId, orientationId);
      }
    });
  }

  getCollaboratorSnapshot(collaboratorId) {
    const periodId = this.state.settings.activePeriod;
    const tasks = this.state.items.filter((item) => item.periodId === periodId && item.kind === "task" && item.collaboratorId === collaboratorId);
    const agenda = this.state.items.filter((item) => item.periodId === periodId && item.kind === "agenda" && item.responsibleId === collaboratorId);
    const notes = this.getPeriodNotes(periodId).collaborators?.[collaboratorId] || {};
    return {
      taskCount: tasks.length,
      openTasks: tasks.filter((item) => isOpenStatus(item.status)).length,
      agendaCount: agenda.length,
      score: notes.score || "-",
      themes: formatList(notes.themes ? normalizeList(notes.themes) : []),
    };
  }

  buildReportPayload() {
    const filters = this.ui.reportFilters;
    const periodId = filters.periodId || this.state.settings.activePeriod;
    const scope = filters.scope;
    const context = filters.context;
    const collaboratorId = filters.collaboratorId;
    let items = this.state.items.filter((item) => item.periodId === periodId);

    if (context === "task") {
      items = items.filter((item) => item.kind === "task");
    }
    if (context === "agenda") {
      items = items.filter((item) => item.kind === "agenda");
    }
    if (collaboratorId !== "all") {
      items = items.filter(
        (item) => item.collaboratorId === collaboratorId || item.responsibleId === collaboratorId
      );
    }
    if (scope === "week") {
      const bounds = getWeekBounds(filters.weekDate || todayIsoDate());
      items = items.filter((item) => dateWithinRange(getItemAnchorDate(item), bounds.start, bounds.end));
    }

    const sortedItems = sortItemsByPriorityAndDate(items);
    const notes = this.getPeriodNotes(periodId);
    const collaboratorNotes = this.getCollaborators()
      .filter((collaborator) => collaboratorId === "all" || collaborator.id === collaboratorId)
      .map((collaborator) => ({
        collaborator,
        note: this.getCollaboratorPeriodNote(collaborator.id, periodId),
      }))
      .filter((entry) => hasCollaboratorPeriodNoteContent(entry.note));

    const open = sortedItems.filter((item) => isOpenStatus(item.status)).length;
    const done = sortedItems.filter((item) => item.status === "done").length;
    const overdue = sortedItems.filter(
      (item) => isOpenStatus(item.status) && item.dueDate && item.dueDate < todayIsoDate()
    ).length;

    return {
      periodId,
      filters,
      items: sortedItems,
      notes,
      collaboratorNotes,
      summary: {
        total: sortedItems.length,
        open,
        done,
        overdue,
      },
      rangeLabel:
        scope === "week"
          ? (() => {
              const bounds = getWeekBounds(filters.weekDate || todayIsoDate());
              return `${formatDate(bounds.start)} ate ${formatDate(bounds.end)}`;
            })()
          : formatPeriodLabel(periodId),
    };
  }

  async persistState() {
    await persistState(this.db, this.state);
  }

  pushToast(message, tone = "default") {
    const id = generateId("toast");
    this.ui.toasts.push({ id, message, tone });
    this.render();
    window.setTimeout(() => {
      this.ui.toasts = this.ui.toasts.filter((toast) => toast.id !== id);
      this.render();
    }, 3200);
  }

  resetEditing(kind) {
    if (kind === "collaborator") {
      this.ui.editingCollaboratorId = "";
    }
    if (kind === "task") {
      this.ui.editingTaskId = "";
    }
    if (kind === "agenda") {
      this.ui.editingAgendaId = "";
    }
  }

  async handleClick(event) {
    const viewButton = event.target.closest("[data-view-target]");
    if (viewButton) {
      this.ui.activeView = viewButton.dataset.viewTarget;
      this.render();
      return;
    }

    const periodButton = event.target.closest("[data-period-shortcut]");
    if (periodButton) {
      const target = periodButton.dataset.periodShortcut;
      await this.preparePeriod(target);
      this.render();
      return;
    }

    const actionButton = event.target.closest("[data-action]");
    if (!actionButton) {
      return;
    }

    const { action, id, kind } = actionButton.dataset;

    if (action === "jump-current-period") {
      await this.preparePeriod(getCurrentPeriodId());
      this.render();
      return;
    }

    if (action === "toggle-sidebar") {
      this.state.settings.sidebarCollapsed = !this.state.settings.sidebarCollapsed;
      await this.persistState();
      this.render();
      return;
    }

    if (action === "edit-collaborator") {
      this.ui.editingCollaboratorId = id;
      this.ui.activeView = "collaborators";
      this.render();
      return;
    }

    if (action === "toggle-collaborator") {
      const collaborator = this.getCollaboratorById(id);
      if (!collaborator) {
        return;
      }
      collaborator.active = !collaborator.active;
      collaborator.updatedAt = nowIso();
      await this.persistState();
      this.pushToast(`Cadastro de ${collaborator.name} atualizado.`);
      this.render();
      return;
    }

    if (action === "cancel-collaborator-edit") {
      this.resetEditing("collaborator");
      this.render();
      return;
    }

    if (action === "edit-item") {
      if (kind === "task") {
        this.ui.editingTaskId = id;
        this.ui.activeView = "tasks";
      } else {
        this.ui.editingAgendaId = id;
        this.ui.activeView = "agenda";
      }
      this.render();
      return;
    }

    if (action === "open-dashboard-item") {
      this.openDashboardItem(id);
      return;
    }

    if (action === "open-dashboard-note") {
      this.openDashboardNote(id);
      return;
    }

    if (action === "open-dashboard-orientation") {
      this.openDashboardNote(id, actionButton.dataset.orientationId || "");
      return;
    }

    if (action === "toggle-dashboard-observation-card") {
      this.setCardCollapsed(
        "dashboard-observations",
        id,
        !this.isCardCollapsed("dashboard-observations", id)
      );
      this.render();
      return;
    }

    if (action === "toggle-dashboard-orientation-card") {
      const orientationId = actionButton.dataset.orientationId || "";
      this.setCardCollapsed(
        "dashboard-orientations",
        orientationId,
        !this.isCardCollapsed("dashboard-orientations", orientationId)
      );
      this.render();
      return;
    }

    if (action === "cancel-item-edit") {
      this.resetEditing(kind);
      this.render();
      return;
    }

    if (action === "toggle-item-complete") {
      const item = this.getItemById(id);
      if (!item) {
        return;
      }
      item.status = item.status === "done" ? "pending" : "done";
      item.updatedAt = nowIso();
      await this.persistState();
      this.pushToast(`${item.kind === "task" ? "Tarefa" : "Pauta"} atualizada.`);
      this.render();
      return;
    }

    if (action === "delete-item") {
      const item = this.getItemById(id);
      if (!item) {
        return;
      }
      const confirmed = window.confirm(`Excluir "${item.title}" do periodo ${formatPeriodLabel(item.periodId)}?`);
      if (!confirmed) {
        return;
      }
      const attachmentIds = item.attachmentRefs.map((attachment) => attachment.id);
      this.state.items = this.state.items.filter((entry) => entry.id !== id);
      await this.cleanupUnusedAttachments(attachmentIds);
      await this.persistState();
      this.pushToast("Registro removido.");
      this.render();
      return;
    }

    if (action === "copy-item") {
      this.ui.copyModal = {
        open: true,
        itemId: id,
        targetPeriod: this.state.settings.activePeriod,
      };
      this.render();
      return;
    }

    if (action === "close-copy-modal") {
      this.ui.copyModal.open = false;
      this.render();
      return;
    }

    if (action === "open-period-summary-email-modal") {
      this.captureNotesDraftFromForm();
      this.ui.periodSummaryEmailModal.open = true;
      this.render();
      return;
    }

    if (action === "close-period-summary-email-modal") {
      this.ui.periodSummaryEmailModal.open = false;
      this.render();
      return;
    }

    if (action === "open-agenda-email-modal") {
      this.ui.agendaEmailModal.open = true;
      this.render();
      return;
    }

    if (action === "close-agenda-email-modal") {
      this.ui.agendaEmailModal.open = false;
      this.render();
      return;
    }

    if (action === "set-collapse-group") {
      this.setCollapseGroup(
        actionButton.dataset.collapseGroup || "",
        actionButton.dataset.collapseState === "collapsed"
      );
      return;
    }

    if (action === "save-notes-draft") {
      this.captureNotesDraftFromForm();
      await this.persistState();
      this.pushToast("Avaliacoes salvas.");
      return;
    }

    if (action === "save-all-state") {
      this.captureNotesDraftFromForm();
      await this.persistState();
      this.pushToast("Todas as alteracoes salvas.");
      return;
    }

    if (action === "send-evaluation-email") {
      this.captureNotesDraftFromForm();
      await this.persistState();
      const payload = this.buildCollaboratorReminderPayload(id);
      await this.dispatchReminderThroughAppsScript(payload);
      this.pushToast("Solicitacao de envio encaminhada ao Google Apps Script.");
      return;
    }

    if (action === "add-guidance-item") {
      this.captureNotesDraftFromForm();
      const note = this.getCollaboratorPeriodNote(id);
      note.guidanceItems.push(normalizeOrientation({}));
      this.render();
      this.focusOrientationField(id, note.guidanceItems.at(-1)?.id || "");
      return;
    }

    if (action === "remove-guidance-item") {
      this.captureNotesDraftFromForm();
      const note = this.getCollaboratorPeriodNote(id);
      note.guidanceItems = note.guidanceItems.filter((item) => item.id !== actionButton.dataset.orientationId);
      await this.persistState();
      this.pushToast("Orientacao removida.");
      this.render();
      return;
    }

    if (action === "save-orientation-item") {
      this.captureNotesDraftFromForm();
      const note = this.getCollaboratorPeriodNote(id);
      const orientationId = actionButton.dataset.orientationId || "";
      const orientation = note.guidanceItems.find((item) => item.id === orientationId);
      if (!orientation?.text) {
        throw new Error("Preencha a orientacao antes de salvar.");
      }
      orientation.updatedAt = nowIso();
      await this.persistState();
      this.pushToast("Orientacao salva.");
      return;
    }

    if (action === "edit-orientation-item") {
      this.captureNotesDraftFromForm();
      const orientationId = actionButton.dataset.orientationId || "";
      this.setCardCollapsed("orientation-items", `${id}:${orientationId}`, false);
      this.render();
      this.focusOrientationField(id, orientationId);
      return;
    }

    if (action === "toggle-orientation-card") {
      this.captureNotesDraftFromForm();
      const orientationId = actionButton.dataset.orientationId || "";
      const collapseKey = `${id}:${orientationId}`;
      this.setCardCollapsed("orientation-items", collapseKey, !this.isCardCollapsed("orientation-items", collapseKey));
      this.render();
      return;
    }

    if (action === "open-orientation-copy-modal") {
      this.captureNotesDraftFromForm();
      const note = this.getCollaboratorPeriodNote(id);
      const sourceOrientation = note.guidanceItems.find((item) => item.id === actionButton.dataset.orientationId);
      if (!sourceOrientation?.text) {
        throw new Error("Preencha a orientacao antes de duplica-la.");
      }
      this.ui.orientationCopyModal = {
        open: true,
        collaboratorId: id,
        orientationId: actionButton.dataset.orientationId || "",
      };
      this.render();
      return;
    }

    if (action === "close-orientation-copy-modal") {
      this.ui.orientationCopyModal.open = false;
      this.render();
      return;
    }

    if (action === "open-attachment") {
      await this.openAttachment(id);
      return;
    }

    if (action === "export-report-csv") {
      this.exportReportCsv();
      return;
    }

    if (action === "export-report-pdf") {
      this.exportReportPdf();
      return;
    }

    if (action === "export-backup") {
      await this.exportBackup();
    }
  }

  async handleChange(event) {
    const target = event.target;

    if (target.id === "backup-import-input" && target.files?.[0]) {
      await this.importBackup(target.files[0]);
      target.value = "";
      return;
    }

    if (target.matches("[data-filter-group]")) {
      const group = target.dataset.filterGroup;
      const stateKey = `${group}Filters`;
      if (this.ui[stateKey]) {
        this.ui[stateKey][target.name] = target.value;
        this.render();
      }
    }
  }

  async handleInput(event) {
    const target = event.target;
    if (target.matches("[data-filter-group]")) {
      const group = target.dataset.filterGroup;
      const stateKey = `${group}Filters`;
      if (this.ui[stateKey]) {
        this.ui[stateKey][target.name] = target.value;
        this.render();
      }
    }
  }

  async handleSubmit(event) {
    event.preventDefault();
    const form = event.target;
    if (!(form instanceof HTMLFormElement)) {
      return;
    }

    if (form.id === "period-form") {
      const periodId = form.periodId.value;
      if (!periodId) {
        throw new Error("Escolha um mes antes de ativar o periodo.");
      }
      await this.preparePeriod(periodId);
      this.render();
      return;
    }

    if (form.id === "collaborator-form") {
      await this.saveCollaborator(form);
      return;
    }

    if (form.id === "email-settings-form") {
      await this.saveEmailSettings(form);
      return;
    }

    if (form.id === "notes-form") {
      await this.saveNotes(form);
      return;
    }

    if (form.id === "task-form") {
      await this.saveItem(form, "task");
      return;
    }

    if (form.id === "agenda-form") {
      await this.saveItem(form, "agenda");
      return;
    }

    if (form.id === "copy-form") {
      await this.copyItem(form);
      return;
    }

    if (form.id === "orientation-copy-form") {
      await this.copyOrientation(form);
      return;
    }

    if (form.id === "period-summary-email-form") {
      await this.sendPeriodSummaryEmail(form);
      return;
    }

    if (form.id === "agenda-email-form") {
      await this.sendAgendaEmail(form);
    }
  }

  async saveCollaborator(form) {
    const formData = new FormData(form);
    const collaboratorId = formData.get("collaboratorId")?.toString();
    const payload = {
      id: collaboratorId || generateId("collab"),
      name: formData.get("name")?.toString().trim() || "",
      role: formData.get("role")?.toString().trim() || "",
      email: formData.get("email")?.toString().trim() || "",
      themes: normalizeList(formData.get("themes")?.toString() || ""),
      guidance: formData.get("guidance")?.toString().trim() || "",
      active: formData.get("active") === "on",
      createdAt: nowIso(),
      updatedAt: nowIso(),
    };

    if (!payload.name) {
      throw new Error("Informe o nome do colaborador.");
    }

    const existingIndex = this.state.collaborators.findIndex((item) => item.id === payload.id);
    if (existingIndex >= 0) {
      payload.createdAt = this.state.collaborators[existingIndex].createdAt;
      this.state.collaborators.splice(existingIndex, 1, payload);
    } else {
      this.state.collaborators.push(payload);
    }

    await this.persistState();
    this.resetEditing("collaborator");
    this.pushToast("Colaborador salvo.");
    this.render();
  }

  async saveEmailSettings(form) {
    const formData = new FormData(form);
    this.state.settings.emailIntegrationUrl = formData.get("emailIntegrationUrl")?.toString().trim() || "";
    this.state.settings.emailIntegrationToken = formData.get("emailIntegrationToken")?.toString().trim() || "";
    await this.persistState();
    this.pushToast("Integracao de e-mail atualizada.");
    this.render();
  }

  async sendPeriodSummaryEmail(form) {
    this.captureNotesDraftFromForm();
    await this.persistState();

    const formData = new FormData(form);
    const recipientEmail = formData.get("recipientEmail")?.toString().trim() || "";
    const mode = formData.get("summaryMode")?.toString() || "general_and_collaborators";

    this.state.settings.periodSummaryRecipient = recipientEmail;
    await this.persistState();

    const payload = this.buildPeriodSummaryEmailPayload(recipientEmail, mode);
    await this.dispatchReminderThroughAppsScript(payload);
    this.ui.periodSummaryEmailModal.open = false;
    this.pushToast("Resumo do periodo encaminhado ao Google Apps Script.");
    this.render();
  }

  async sendAgendaEmail(form) {
    const formData = new FormData(form);
    const recipientEmail = formData.get("recipientEmail")?.toString().trim() || "";
    const scope = formData.get("agendaScope")?.toString() || "month";
    const weekDate = formData.get("weekDate")?.toString() || todayIsoDate();

    this.state.settings.agendaEmailRecipient = recipientEmail;
    await this.persistState();

    const payload = await this.buildAgendaEmailPayload(recipientEmail, { scope, weekDate });
    await this.dispatchReminderThroughAppsScript(payload);
    this.ui.agendaEmailModal.open = false;
    this.pushToast("Pautas encaminhadas ao Google Apps Script.");
    this.render();
  }

  async saveNotes(form) {
    this.captureNotesDraftFromForm(form);
    await this.persistState();
    this.pushToast("Avaliacoes do periodo atualizadas.");
    this.render();
  }

  async saveItem(form, kind) {
    const formData = new FormData(form);
    const editingId = formData.get("itemId")?.toString() || "";
    const existing = editingId ? this.getItemById(editingId) : null;
    const files = Array.from(form.querySelector('input[type="file"]')?.files || []);
    const newAttachments = [];
    for (const file of files) {
      const attachmentId = generateId("att");
      await putAttachment(this.db, {
        id: attachmentId,
        name: file.name,
        type: file.type || "application/octet-stream",
        size: file.size || 0,
        blob: file,
        createdAt: nowIso(),
      });
      newAttachments.push({
        id: attachmentId,
        name: file.name,
        type: file.type || "application/octet-stream",
        size: file.size || 0,
      });
    }

    const removedAttachmentIds = formData.getAll("removeAttachmentIds").map((value) => value.toString());
    const remainingExistingAttachments = existing
      ? existing.attachmentRefs.filter((attachment) => !removedAttachmentIds.includes(attachment.id))
      : [];

    const payload = {
      id: existing?.id || generateId("item"),
      kind,
      periodId: this.state.settings.activePeriod,
      title: formData.get("title")?.toString().trim() || "",
      description: formData.get("description")?.toString().trim() || "",
      observations: formData.get("observations")?.toString().trim() || "",
      collaboratorId: kind === "task" ? formData.get("collaboratorId")?.toString() || "" : "",
      responsibleId:
        kind === "agenda"
          ? formData.get("responsibleId")?.toString() || ""
          : formData.get("collaboratorId")?.toString() || "",
      priority: formData.get("priority")?.toString() || "medium",
      status: formData.get("status")?.toString() || "pending",
      referenceDate: formData.get("referenceDate")?.toString() || "",
      dueDate: formData.get("dueDate")?.toString() || "",
      themes: normalizeList(formData.get("themes")?.toString() || ""),
      attachmentRefs: [...remainingExistingAttachments, ...newAttachments],
      sourceItemId: existing?.sourceItemId || "",
      copiedFromId: existing?.copiedFromId || "",
      carryRootId: existing?.carryRootId || "",
      carriedFromPeriodId: existing?.carriedFromPeriodId || "",
      createdAt: existing?.createdAt || nowIso(),
      updatedAt: nowIso(),
    };

    if (!payload.title) {
      throw new Error("Informe um titulo para o registro.");
    }
    if (kind === "task" && !payload.collaboratorId) {
      throw new Error("Selecione o colaborador dono da tarefa.");
    }

    if (!payload.carryRootId) {
      payload.carryRootId = payload.id;
    }

    const existingIndex = this.state.items.findIndex((item) => item.id === payload.id);
    if (existingIndex >= 0) {
      this.state.items.splice(existingIndex, 1, payload);
    } else {
      this.state.items.push(payload);
    }

    await this.cleanupUnusedAttachments(removedAttachmentIds);
    await this.persistState();
    this.resetEditing(kind);
    this.pushToast(kind === "task" ? "Tarefa salva." : "Pauta salva.");
    this.render();
  }

  async cleanupUnusedAttachments(candidateIds) {
    if (!candidateIds?.length) {
      return;
    }
    const usedIds = new Set(
      this.state.items.flatMap((item) => item.attachmentRefs.map((attachment) => attachment.id))
    );
    for (const attachmentId of candidateIds) {
      if (!usedIds.has(attachmentId)) {
        await deleteAttachment(this.db, attachmentId);
      }
    }
  }

  async copyItem(form) {
    const formData = new FormData(form);
    const sourceItemId = formData.get("itemId")?.toString() || "";
    const source = this.getItemById(sourceItemId);
    if (!source) {
      throw new Error("Nao foi possivel localizar o item de origem.");
    }
    const targetPeriod = formData.get("targetPeriod")?.toString() || this.state.settings.activePeriod;
    await this.preparePeriod(targetPeriod, { silent: true, activate: false });

    const selectedCollaborators = formData.getAll("targetCollaboratorIds").map((value) => value.toString());
    const copyToAgenda = formData.get("copyToAgenda") === "on";
    const statusOverride = formData.get("statusOverride")?.toString() || "pending";

    const newItems = [];
    const normalizedStatus = statusOverride === "keep" ? source.status : "pending";

    if (source.kind === "task" && copyToAgenda) {
      const newId = generateId("item");
      newItems.push({
        ...source,
        id: newId,
        kind: "agenda",
        periodId: targetPeriod,
        collaboratorId: "",
        responsibleId: source.collaboratorId || source.responsibleId,
        status: normalizedStatus,
        carryRootId: newId,
        sourceItemId: "",
        copiedFromId: source.id,
        carriedFromPeriodId: "",
        createdAt: nowIso(),
        updatedAt: nowIso(),
      });
    }

    for (const collaboratorId of selectedCollaborators) {
      const newId = generateId("item");
      newItems.push({
        ...source,
        id: newId,
        kind: "task",
        periodId: targetPeriod,
        collaboratorId,
        responsibleId: collaboratorId,
        status: normalizedStatus,
        carryRootId: newId,
        sourceItemId: "",
        copiedFromId: source.id,
        carriedFromPeriodId: "",
        createdAt: nowIso(),
        updatedAt: nowIso(),
      });
    }

    if (!newItems.length) {
      throw new Error("Selecione pelo menos um destino para a copia.");
    }

    this.state.items.push(...newItems);
    await this.persistState();
    this.ui.copyModal.open = false;
    this.pushToast(`${newItems.length} copia(s) gerada(s) com sucesso.`);
    this.render();
  }

  async copyOrientation(form) {
    const formData = new FormData(form);
    const collaboratorId = formData.get("sourceCollaboratorId")?.toString() || "";
    const orientationId = formData.get("orientationId")?.toString() || "";
    const sourceNote = this.getCollaboratorPeriodNote(collaboratorId);
    const sourceOrientation = sourceNote.guidanceItems.find((item) => item.id === orientationId);
    if (!sourceOrientation?.text) {
      throw new Error("Orientacao de origem nao encontrada.");
    }

    const activeTargets = this.getCollaborators(false).filter((collaborator) => collaborator.id !== collaboratorId);
    const selectedIds =
      formData.get("targetAll") === "on"
        ? activeTargets.map((collaborator) => collaborator.id)
        : activeTargets
            .filter((collaborator) => formData.get(`target-${collaborator.id}`) === "on")
            .map((collaborator) => collaborator.id);

    if (!selectedIds.length) {
      throw new Error("Selecione pelo menos um colaborador ativo para duplicar a orientacao.");
    }

    for (const targetId of new Set(selectedIds)) {
      const targetNote = this.getCollaboratorPeriodNote(targetId);
      targetNote.guidanceItems.push(
        normalizeOrientation({
          ...sourceOrientation,
          id: generateId("orientation"),
          createdAt: nowIso(),
          updatedAt: nowIso(),
        })
      );
    }

    await this.persistState();
    this.ui.orientationCopyModal.open = false;
    this.pushToast(`Orientacao duplicada para ${selectedIds.length} colaborador(es).`);
    this.render();
  }

  async openAttachment(attachmentId) {
    const record = await getAttachment(this.db, attachmentId);
    if (!record?.blob) {
      throw new Error("Arquivo nao encontrado no armazenamento local.");
    }
    const url = URL.createObjectURL(record.blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    if (record.type.startsWith("image/") || record.type.includes("pdf") || record.type.startsWith("text/")) {
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer";
    } else {
      anchor.download = record.name;
    }
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4_000);
  }

  async exportBackup() {
    const attachmentRecords = await getAllAttachments(this.db);
    const attachments = [];
    for (const record of attachmentRecords) {
      attachments.push({
        id: record.id,
        name: record.name,
        type: record.type,
        size: record.size,
        dataUrl: await blobToDataUrl(record.blob),
      });
    }
    const payload = {
      exportedAt: nowIso(),
      state: this.state,
      attachments,
    };
    const filename = `backup-coordenacao-tributaria-${todayIsoDate()}.json`;
    downloadBlob(filename, new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }));
    this.pushToast("Backup completo exportado.");
  }

  async importBackup(file) {
    const confirmed = window.confirm(
      "Importar o backup vai substituir os dados atuais deste navegador. Deseja continuar?"
    );
    if (!confirmed) {
      return;
    }
    const text = await file.text();
    const parsed = JSON.parse(text);
    if (!parsed?.state) {
      throw new Error("Arquivo de backup invalido.");
    }
    const nextState = normalizeState(parsed.state);
    await clearAttachments(this.db);
    for (const attachment of parsed.attachments || []) {
      await putAttachment(this.db, {
        id: attachment.id,
        name: attachment.name,
        type: attachment.type,
        size: attachment.size,
        blob: dataUrlToBlob(attachment.dataUrl, attachment.type),
        createdAt: nowIso(),
      });
    }
    this.state = nextState;
    this.ensurePeriodStructures(this.state.settings.activePeriod);
    await this.persistState();
    this.resetEditing("collaborator");
    this.resetEditing("task");
    this.resetEditing("agenda");
    this.ui.copyModal.open = false;
    this.ui.orientationCopyModal.open = false;
    this.ui.periodSummaryEmailModal.open = false;
    this.ui.agendaEmailModal.open = false;
    this.ui.reportFilters.periodId = this.state.settings.activePeriod;
    this.pushToast("Backup importado com sucesso.");
    this.render();
  }

  exportReportCsv() {
    const payload = this.buildReportPayload();
    const rows = [
      [
        "Periodo",
        "Escopo",
        "Tipo",
        "Titulo",
        "Colaborador",
        "Responsavel",
        "Prioridade",
        "Status",
        "Data referencia",
        "Prazo",
        "Temas",
        "Observacoes",
        "Anexos",
        "Origem",
      ],
    ];

    for (const item of payload.items) {
      rows.push([
        formatPeriodLabel(item.periodId),
        payload.rangeLabel,
        item.kind === "task" ? "Tarefa" : "Pauta",
        item.title,
        this.getCollaboratorName(item.collaboratorId),
        this.getCollaboratorName(item.responsibleId),
        PRIORITY_META[item.priority]?.label || item.priority,
        STATUS_META[item.status]?.label || item.status,
        formatDate(item.referenceDate),
        formatDate(item.dueDate),
        item.themes.join(", "),
        item.observations || item.description,
        item.attachmentRefs.map((attachment) => attachment.name).join(", "),
        item.carriedFromPeriodId ? `Trazido de ${formatPeriodLabel(item.carriedFromPeriodId)}` : "",
      ]);
    }

    if (payload.filters.scope === "month") {
      for (const entry of payload.collaboratorNotes) {
        rows.push([
          formatPeriodLabel(payload.periodId),
          payload.rangeLabel,
          "Avaliacao",
          `Avaliacao mensal - ${entry.collaborator.name}`,
          entry.collaborator.name,
          "-",
          "-",
          `Nota ${entry.note.score || "-"}`,
          "-",
          "-",
          entry.note.themes || "",
          [entry.note.note, formatOrientationSummaryText(entry.note.guidanceItems)].filter(Boolean).join(" | "),
          "-",
          "",
        ]);
      }
    }

    const csv = buildCsv(rows);
    downloadBlob(
      `relatorio-${payload.periodId}-${payload.filters.scope}.csv`,
      new Blob([csv], { type: "text/csv;charset=utf-8;" })
    );
    this.pushToast("Tabela CSV exportada.");
  }

  exportReportPdf() {
    const payload = this.buildReportPayload();
    const reportWindow = window.open("", "_blank", "noopener,noreferrer,width=1200,height=900");
    if (!reportWindow) {
      throw new Error("Nao foi possivel abrir a janela de impressao. Verifique se o navegador bloqueou popups.");
    }
    reportWindow.document.write(this.buildPrintableReportHtml(payload));
    reportWindow.document.close();
    reportWindow.focus();
    window.setTimeout(() => reportWindow.print(), 450);
    this.pushToast("Relatorio aberto para exportacao em PDF.");
  }

  buildPrintableReportHtml(payload) {
    const rowsHtml = payload.items.length
      ? payload.items
          .map(
            (item) => `
              <tr>
                <td>${escapeHtml(item.kind === "task" ? "Tarefa" : "Pauta")}</td>
                <td>${escapeHtml(item.title)}</td>
                <td>${escapeHtml(this.getCollaboratorName(item.collaboratorId))}</td>
                <td>${escapeHtml(this.getCollaboratorName(item.responsibleId))}</td>
                <td>${escapeHtml(PRIORITY_META[item.priority]?.label || item.priority)}</td>
                <td>${escapeHtml(STATUS_META[item.status]?.label || item.status)}</td>
                <td>${escapeHtml(formatDate(item.referenceDate))}</td>
                <td>${escapeHtml(formatDate(item.dueDate))}</td>
                <td>${escapeHtml(item.themes.join(", "))}</td>
                <td>${renderMultiline(item.description || item.observations || "-")}</td>
              </tr>`
          )
          .join("")
      : `<tr><td colspan="10">Nenhum registro encontrado para o filtro selecionado.</td></tr>`;

    const notesHtml =
      payload.filters.scope === "month"
        ? `
        <section class="notes">
          <h2>Resumo do periodo</h2>
          <p><strong>Notas gerais:</strong><br>${renderMultiline(payload.notes.generalNotes || "-") || "-"}</p>
        </section>
        <section class="notes">
          <h2>Observacoes por colaborador</h2>
          ${
            payload.collaboratorNotes.length
              ? payload.collaboratorNotes
                  .map(
                    (entry) => `
                    <article class="note-card">
                      <h3>${escapeHtml(entry.collaborator.name)}</h3>
                      <p><strong>Nota:</strong> ${escapeHtml(entry.note.score || "-")}</p>
                      <p><strong>Temas:</strong> ${escapeHtml(entry.note.themes || "-")}</p>

        <body>
          <h1>Relatorio de ${escapeHtml(payload.rangeLabel)}</h1>
          <p>Periodo base: ${escapeHtml(formatPeriodLabel(payload.periodId))}</p>

            <article><strong>Abertos</strong><div>${payload.summary.open}</div></article>

  render() {
    const supportedViewIds = new Set([...VIEW_META.map((view) => view.id), "tasks", "reports"]);
    if (!supportedViewIds.has(this.ui.activeView)) {
      this.ui.activeView = "dashboard";
    }
    this.root.className = `app-shell${this.state.settings.sidebarCollapsed ? " app-shell--sidebar-collapsed" : ""}`;
    const dashboard = this.getDashboardStats();
    const reportPayload = this.buildReportPayload();
    this.root.innerHTML = `
      <aside class="sidebar ${this.state.settings.sidebarCollapsed ? "is-collapsed" : ""}">
        ${this.renderSidebar()}
      </aside>
      <main class="content">
        ${this.renderToolbar()}
        <div class="views">
          ${this.renderDashboardView(dashboard)}
          ${this.renderCollaboratorsView()}
          ${this.renderNotesView()}
          ${this.renderTasksView()}
          ${this.renderAgendaView()}
          ${this.renderReportsView(reportPayload)}
        </div>
      </main>
      ${this.renderCopyModal()}
      ${this.renderOrientationCopyModal()}
      ${this.renderPeriodSummaryEmailModal()}
      ${this.renderAgendaEmailModal()}
      <div class="toast-stack">
        ${this.ui.toasts
          .map(
            (toast) =>
              `<div class="toast" data-tone="${escapeHtml(toast.tone)}">${escapeHtml(toast.message)}</div>`
          )
          .join("")}
      </div>
    `;
  }

  renderSidebar() {
    const knownPeriods = this.getKnownPeriods().sort((left, right) => right.localeCompare(left));
    const activePeriodMeta = this.state.periods[this.state.settings.activePeriod] || {};
    const sourceLabel = activePeriodMeta.sourcePeriodId
      ? `Pendencias abertas foram trazidas de ${formatPeriodLabel(activePeriodMeta.sourcePeriodId)}.`
      : "Periodo pronto para cadastro, reunioes e avaliacoes.";
    const sidebarToggle = `
      <div class="sidebar-toggle-row ${this.state.settings.sidebarCollapsed ? "sidebar-toggle-row--collapsed" : ""}">
        ${this.renderArrowToggleButton({
          collapsed: this.state.settings.sidebarCollapsed,
          label: this.state.settings.sidebarCollapsed ? "Reabrir navegacao" : "Esconder navegacao",
          attributes: { action: "toggle-sidebar" },
        })}
      </div>
    `;

    if (this.state.settings.sidebarCollapsed) {
      return sidebarToggle;
    }

    return `
      ${sidebarToggle}
      <div class="brand-block sidebar-section">
        <span class="eyebrow">Artefato local</span>
        <h1>Coord. Tributaria</h1>
        <p>Controle mensal e semanal de colaboradores, tarefas, pautas, anexos, notas e historico do departamento.</p>
      </div>

      <section class="sidebar-section period-panel">
        <form id="period-form" class="period-form">
          <label>
            <span>Periodo ativo</span>
            <input type="month" name="periodId" value="${escapeHtml(this.state.settings.activePeriod)}">
          </label>
          <div class="button-row">
            <button type="submit">Ativar periodo</button>
            <button type="button" class="ghost-button" data-action="jump-current-period">Mes atual</button>
          </div>
        </form>
        <p>${escapeHtml(sourceLabel)}</p>
      </section>

      <section class="sidebar-section">
        <div class="section-header">
          <h2>Periodos salvos</h2>
        </div>
        <div class="period-chip-list">
          ${
            knownPeriods.length
              ? knownPeriods
                  .map(
                    (period) => `
                    <button
                      type="button"
                      class="period-chip ${period === this.state.settings.activePeriod ? "is-current" : ""}"
                      data-period-shortcut="${escapeHtml(period)}"
                    >
                      ${escapeHtml(formatPeriodLabel(period))}
                    </button>
                  `
                  )
                  .join("")
              : `<span class="muted-text">Nenhum periodo salvo ainda.</span>`
          }
        </div>
      </section>

      <section class="sidebar-section">
        <div class="section-header">
          <h2>Navegacao</h2>
        </div>
        <nav class="nav-grid">
          ${VIEW_META.map(
            (view) => `
              <button
                type="button"
                class="nav-button ${this.ui.activeView === view.id ? "is-active" : ""}"
                data-view-target="${escapeHtml(view.id)}"
              >
                ${escapeHtml(view.label)}
              </button>
            `
          ).join("")}
        </nav>
      </section>

      <section class="sidebar-section">
        <div class="section-header">
          <h2>Envio de e-mail</h2>
        </div>
        <form id="email-settings-form" class="stack-form sidebar-form">
          <label class="field">
            <span>URL do Apps Script</span>
            <input
              name="emailIntegrationUrl"
              value="${escapeHtml(this.state.settings.emailIntegrationUrl || "")}"
              placeholder="Cole aqui a URL do Web App"
            >
          </label>
          <label class="field">
            <span>Token de seguranca</span>
            <input
              name="emailIntegrationToken"
              value="${escapeHtml(this.state.settings.emailIntegrationToken || "")}"
              placeholder="Opcional"
            >
          </label>
          <div class="button-row">
            <button type="submit">Salvar integracao</button>
          </div>
        </form>
        <p class="quick-actions__hint">Depois de publicar o Google Apps Script como Web App, cole a URL aqui. O app enviara as observacoes e orientacoes do colaborador para o e-mail cadastrado.</p>
      </section>

      <section class="sidebar-section">
        <div class="section-header">
          <h2>Seguranca local</h2>
        </div>
        <div class="quick-actions">
          <button type="button" class="ghost-button" data-action="export-backup">Exportar backup</button>
          <label class="button-like">
            Importar backup
            <input id="backup-import-input" type="file" accept=".json">
          </label>
        </div>
        <p class="quick-actions__hint">Os dados ficam neste navegador. Use o backup JSON para preservar anexos e historico.</p>
      </section>
    `;
  }

  renderToolbar() {
    const toolbarActionsClass =
      this.ui.activeView === "agenda"
        ? "toolbar-actions toolbar-actions--grid toolbar-actions--with-secondary"
        : "toolbar-actions toolbar-actions--grid";
    return `
      <header class="toolbar">
        <div>
          <span class="eyebrow">Gestao semanal + historico mensal</span>
          <h1>Reunioes, pautas e avaliacoes em um unico lugar</h1>
          <p>
            Periodo atual: <strong>${escapeHtml(formatPeriodLabel(this.state.settings.activePeriod))}</strong>.
            Pendencias abertas continuam de um mes para o outro sem perder o historico anterior.
          </p>
        </div>
        <div class="${toolbarActionsClass}">
          <button type="button" class="ghost-button" data-view-target="agenda">Abrir pautas</button>
          <button type="button" class="ghost-button" data-view-target="dashboard">Atualizar dashboard</button>
          ${
            this.ui.activeView === "agenda"
              ? `
                <button
                  type="button"
                  class="ghost-button toolbar-actions__secondary"
                  data-action="open-agenda-email-modal"
                >
                  Enviar pautas por e-mail
                </button>
              `
              : ""
          }
        </div>
      </header>
    `;
  }

  renderDashboardView(stats) {
    return `
      <section class="view ${this.ui.activeView === "dashboard" ? "is-active" : ""}">
        <div class="panel dashboard-panel">
          <div class="panel-header">
            <div>
              <h2>Panorama do periodo</h2>
              <p>Leitura executiva das pendencias do mes, com acesso direto aos registros mais relevantes.</p>
            </div>
            <div class="panel-header__actions">
              <span class="badge-inline">${escapeHtml(formatPeriodLabel(this.state.settings.activePeriod))}</span>
              <button type="button" class="ghost-button" data-action="save-all-state">Salvar tudo</button>
            </div>
          </div>
          <div class="metric-cards dashboard-metric-cards">
            <article class="metric-card metric-card--dashboard">
              <span class="eyebrow">Total</span>
              <strong>${stats.total}</strong>
              <p>tarefas e pautas registradas</p>
            </article>
            <article class="metric-card metric-card--dashboard">
              <span class="eyebrow">Abertos</span>

              <p>${stats.openTasks} tarefa(s) e ${stats.openAgenda} pauta(s) em acompanhamento</p>

              <p>pendencias com prazo vencido</p>

              <span class="eyebrow">Concluidos</span>
              <strong>${stats.completed}</strong>
              <p>entregas finalizadas no periodo</p>
            </article>
            <article class="metric-card metric-card--dashboard">
              <span class="eyebrow">Trazidos</span>
              <strong>${stats.carried}</strong>
              <p>itens carregados de meses anteriores</p>
            </article>
          </div>
        </div>

        <div class="dashboard-grid">
          <article class="chart-card span-6">
            <div class="chart-card__header">
              <div>
                <h2>Observacoes da equipe</h2>
                <p>Veja rapidamente quem tem observacoes preenchidas e leia o conteudo sem sair do dashboard.</p>
              </div>
            </div>
            ${

                ? `
                  <div class="dashboard-observation-list">
                    ${stats.collaboratorObservations.map((entry) => this.renderDashboardObservationCard(entry)).join("")}

                `

          </article>

          <article class="chart-card span-6">
