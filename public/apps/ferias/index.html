<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Controle de Férias</title>
<link rel="icon" href="/hub-icon.svg" type="image/svg+xml">
<script src="tema.js?v=1.5.0-hub1"></script>
<link rel="stylesheet" href="styles.css?v=1.5.0-hub1">
<script src="hub-ferias.js?v=1.5.0-hub1" defer></script>
</head>
<body>

<!-- Aviso do HUB (sessão vencida ou banco ainda não preparado) -->
<section id="hubFeriasAviso" class="tela-login" hidden>
  <div class="cartao-login">
    <div class="marca grande"><span class="logo">HT</span></div>
    <div class="login-titulo"><h1>Controle de Férias</h1><p>H. Teixeira Contabilidade</p></div>
    <p class="erro" role="alert"></p>
    <button class="btn primario largo" type="button" onclick="location.reload()">Tentar de novo</button>
  </div>
</section>

<!-- Login -->
<section id="telaLogin" class="tela-login" hidden>
  <button class="btn icone tema-flutuante" type="button" data-acao="tema"></button>
  <form id="formLogin" class="cartao-login" autocomplete="on">
    <div class="marca grande"><span class="logo">HT</span></div>
    <div class="login-titulo"><h1>Controle de Férias</h1><p>H. Teixeira Contabilidade</p></div>
    <label>Usuário<input name="login" autocomplete="username" required autofocus></label>
    <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
    <p class="erro" id="erroLogin" role="alert"></p>
    <button class="btn primario largo" type="submit">Entrar</button>
  </form>
</section>

<!-- Troca obrigatória de senha -->
<section id="telaSenha" class="tela-login" hidden>
  <button class="btn icone tema-flutuante" type="button" data-acao="tema"></button>
  <form id="formSenhaObrig" class="cartao-login">
    <div class="marca grande"><span class="logo">HT</span></div>
    <div class="login-titulo"><h1>Defina sua senha</h1><p>Primeiro acesso ou senha redefinida pelo ADM</p></div>
    <label>Senha atual<input name="atual" type="password" autocomplete="current-password" required></label>
    <label>Nova senha (mín. 6)<input name="nova" type="password" autocomplete="new-password" minlength="6" required></label>
    <label>Repita a nova senha<input name="nova2" type="password" autocomplete="new-password" minlength="6" required></label>
    <p class="erro" id="erroSenhaObrig" role="alert"></p>
    <button class="btn primario largo" type="submit">Salvar e entrar</button>
    <button class="btn link" type="button" data-acao="sair">Sair</button>
  </form>
</section>

<!-- App -->
<div id="app" hidden>
  <header class="topo">
    <div class="topo-in">
      <div class="marca"><span class="logo">HT</span><div><strong>Controle de Férias</strong><small id="semestreTopo"></small></div></div>
      <nav class="abas" id="abas" aria-label="Seções">
        <button data-view="painel" class="ativa"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="8" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.8"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.8"/><rect x="3.5" y="14.5" width="7" height="6" rx="1.8"/></svg>Painel</button>
        <button data-view="calendario"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendário</button>
        <button data-view="lista"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>Férias</button>
        <button data-view="ausencias"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></svg>Ausências</button>
        <button data-view="usuarios" data-adm><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg>Usuários</button>
        <button data-view="feriados"><svg class="ic" viewBox="0 0 24 24"><path d="M5.5 21V4M5.5 4.5h11l-2.2 4 2.2 4h-11"/></svg>Feriados</button>
      </nav>
      <div class="topo-acoes">
        <button class="btn" data-acao="nova-ausencia" title="Registrar um ou mais dias de ausência (não é férias)"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Ausência</button>
        <button class="btn primario" data-acao="nova-ferias" id="btnNovaTopo"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Férias</button>
        <button class="btn icone" data-acao="tema"></button>
        <button class="btn icone" data-acao="backup" data-adm title="Backup XLSX — baixa todos os dados em planilha Excel" aria-label="Backup XLSX"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M4.5 19.5h15"/></svg></button>
        <details class="menu-usuario">
          <summary><span class="avatar" id="avatarUsuario"></span><span id="nomeUsuario" class="nome-usuario">Usuário</span></summary>
          <div class="menu">
            <span id="papelUsuario" class="muted"></span>
            <button data-acao="backup" data-adm>Backup XLSX</button>
          </div>
        </details>
      </div>
    </div>
  </header>

  <main>
    <section id="view-painel" class="view"></section>
    <section id="view-calendario" class="view" hidden></section>
    <section id="view-lista" class="view" hidden></section>
    <section id="view-ausencias" class="view" hidden></section>
    <section id="view-usuarios" class="view" hidden></section>
    <section id="view-feriados" class="view" hidden></section>
  </main>
</div>

<dialog id="modal"><div id="modalCorpo"></div></dialog>
<div id="toasts" aria-live="polite"></div>
<script src="/apps/hub-app-shell.js" defer></script>
</body>
</html>
